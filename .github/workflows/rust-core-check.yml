name: Rust core migration check

on:
  push:
    branches:
      - hardening/rust-game-core-0.9.3

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --manifest-path crates/game-core/Cargo.toml
      - run: cargo clippy --manifest-path crates/game-core/Cargo.toml --all-targets -- -D warnings
      - run: cargo check --manifest-path src-tauri/Cargo.toml
