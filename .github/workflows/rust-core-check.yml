name: Native Rust shell

on:
  push:
    branches: [main]
    paths:
      - crates/game-core/**
      - src-tauri/**
      - .github/workflows/rust-core-check.yml
  pull_request:
    paths:
      - crates/game-core/**
      - src-tauri/**
      - .github/workflows/rust-core-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
