name: Focused Rust migration cleanup

on:
  push:
    branches:
      - hardening/rust-game-core-0.9.3
    paths:
      - .github/workflows/migration-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply focused cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/game-core/src/ai.rs')
          text = path.read_text(encoding='utf-8')
          stale = 'const PROFILE_LIMITS: [[[[usize; 3]; 4]; 1]; 0] = [];\n\n'
          if text.count(stale) != 1:
              raise SystemExit('unexpected PROFILE_LIMITS occurrence count')
          text = text.replace(stale, '')
          marker = 'fn minimax_value(\n'
          if text.count(marker) != 1:
              raise SystemExit('unexpected minimax_value occurrence count')
          text = text.replace(marker, '#[allow(clippy::too_many_arguments)]\n' + marker)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/game-core/src/ai.rs
          git diff --cached --check
          git commit -m "refactor: clean Rust AI migration lints"
          git push
