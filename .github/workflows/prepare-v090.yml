          )
          replace_once("README_RU.md", "| ИИ | детерминированный ограниченный стратегический minimax поверх game core |", "| ИИ | детерминированный ограниченный стратегический minimax поверх game core, выполняемый в browser Web Worker |")
          replace_once(
