              "- режим, уровень сложности, состояние «компьютер думает», ход и захват доступны через локализованные status/live пути;\n- справка и подтверждение новой игры используют доступные встроенные диалоги вместо `window.confirm()`;\n- на мобильном основные действия остаются видимыми в компактной панели из четырёх кнопок."
          )
          replace_once(
              "README_RU.md",
              "- зафиксированный `package-lock.json` и воспроизводимая установка через `npm ci` в CI и GitHub Pages;",
              "- вычисление хода компьютера в отменяемом Web Worker при сохранении авторитетного принятия через `playMove()`;\n- маркер последнего хода, счётчик ходов, обратная связь о захвате/ошибочном ходе, desktop snap-preview, компактная first-run подсказка и кнопка «Показать игру»;\n- зафиксированный `package-lock.json` и воспроизводимая установка через `npm ci` в CI и GitHub Pages;"
