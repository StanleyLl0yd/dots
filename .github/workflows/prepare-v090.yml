name: Prepare v0.9.0 metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-v090.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Synchronize UX release documentation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once("README.md", "source-0.8.2-16A34A", "source-0.9.0-16A34A")
          replace_once(
              "README.md",
              "Current source version: **0.8.2** · advanced classic capture rules + local two-player mode + strategically refined four-level computer opponent + reversible sessions + practically unbounded board + hardened PWA/accessibility + reproducible audited toolchain",
              "Current source version: **0.9.0** · advanced classic capture rules + local/tactical four-level computer play + responsive Worker-based AI turns + polished board feedback/navigation + hardened PWA/accessibility + reproducible audited toolchain"
          )
          replace_once(
              "README.md",
              "The computer opponent is completely local and offline. It does not use a server, external API, machine-learning model, analytics, or randomness. `src/game/ai.ts` consumes the same authoritative `GameState`, and every candidate is validated through the existing game core.",
              "The computer opponent is completely local and offline. It does not use a server, external API, machine-learning model, analytics, or randomness. `src/game/ai.ts` remains a pure consumer of the authoritative `GameState`; in the browser its potentially expensive search now runs inside a cancellable Web Worker, and the returned coordinate is still accepted only through the existing `playMove()` game-core path."
          )
          replace_once(
              "README.md",
              "- **Keyboard:** focus the board, use arrow keys to move the intersection cursor, **Enter / Space** to place a dot, and **+ / -** to zoom.\n- Viewport state is restored separately from the saved game. New game resets the viewport to origin at 100% zoom.",
              "- **Keyboard:** focus the board, use arrow keys to move the intersection cursor, **Enter / Space** to place a dot, and **+ / -** to zoom.\n- **Mouse hover** shows the exact grid intersection that a click will snap to.\n- **Fit game** recenters and scales the viewport so the full played position is visible without changing game coordinates.\n- The latest move has a subtle ring marker; rejected placements get a short visual marker.\n- Viewport state is restored separately from the saved game. New game resets the viewport to origin at 100% zoom."
          )
          replace_once(
              "README.md",
              "- localized computer-thinking, computer-move, mode, and difficulty controls reuse the same accessible status path.",
              "- localized computer-thinking, computer-move, capture, mode, and difficulty feedback reuse accessible live/status paths;\n- accessible native dialogs provide Help and New game confirmation instead of browser-native `confirm()`;\n- the mobile toolbar keeps the four primary actions visible as compact labeled icons."
          )
          replace_once(
              "README.md",
              "- exact Undo, confirmed New game, versioned move-log persistence, and deterministic replay restore;\n- practically unbounded pan/zoom viewport for mouse, trackpad, touch, pinch, and keyboard;",
              "- exact Undo, accessible confirmed New game, versioned move-log persistence, and deterministic replay restore;\n- AI turns computed in a cancellable Web Worker while acceptance remains authoritative in `playMove()`;\n- last-move marker, move counter, capture feedback, invalid-move marker, desktop snap preview, compact first-run help, and responsive action toolbar;\n- practically unbounded pan/zoom viewport for mouse, trackpad, touch, pinch, and keyboard plus one-action Fit game recentering;"
          )
          replace_once(
              "README.md",
              "Version **0.8.2** is a technical hardening release. It patches vulnerable development tooling and makes dependency resolution/security checks reproducible without changing game rules, saves, UI behavior, or AI decisions.",
              "Version **0.9.0** is the pre-1.0 game-UX polish release. It keeps rules, saved-game format, and AI decisions unchanged while moving browser AI search off the UI thread and making the current move, captures, invalid input, board recovery, help, mobile actions, and destructive confirmation clearer."
          )
          replace_once("README.md", "| AI | deterministic bounded strategic minimax over the game core |", "| AI | deterministic bounded strategic minimax over the game core, executed in a browser Web Worker |")
          replace_once(
              "README.md",
              "│   ├── ai.ts              pure multi-level strategic computer search\n│   ├── ai-match.ts        deterministic AI-vs-AI regression harness",
              "│   ├── ai.ts              pure multi-level strategic computer search\n│   ├── ai-worker.ts       browser Worker entry for isolated AI computation\n│   ├── ai-worker-protocol.ts  typed Worker request/response contract\n│   ├── ai-match.ts        deterministic AI-vs-AI regression harness"
          )
          replace_once(
              "README.md",
              "└── verify-build.mjs       production PWA artifact verification",
              "└── verify-build.mjs       production PWA/AI-worker artifact verification"
          )
          replace_once(
              "README.md",
              "`npm run build` includes TypeScript validation, the Vite/PWA production build, and post-build verification of generated PWA artifacts.",
              "`npm run build` includes TypeScript validation, the Vite/PWA production build, and post-build verification of generated PWA plus AI Web Worker artifacts."
          )
          replace_once(
              "README.md",
              "1. Continue real-device/browser and adversarial topology validation, including Expert-mode responsiveness on mobile hardware.\n2. Improve AI only from concrete failing positions or strength-regression evidence while preserving deterministic bounded search.\n3. Add optional import/export only if it stays simple and useful.\n4. Optionally package the same codebase for Android through Capacitor later.",
              "1. Treat 0.9.x as the release-candidate line: perform empirical desktop/mobile browser and installed-PWA testing and fix only concrete regressions.\n2. Continue adversarial topology and AI tactical validation without adding speculative gameplay features before 1.0.\n3. Release 1.0.0 after clean real-device, persistence, offline/update, Worker-cancellation, and long-game checks.\n4. Consider optional import/export or Android/Capacitor packaging only after the stable 1.0 web/PWA release."
          )

          replace_once("README_RU.md", "source-0.8.2-16A34A", "source-0.9.0-16A34A")
          replace_once(
              "README_RU.md",
              "Текущая версия исходников: **0.8.2** · классические расширенные правила окружений + локальная игра вдвоём + стратегически усиленный компьютер с четырьмя уровнями + обратимая партия + практически неограниченное поле + PWA/доступность + воспроизводимый проверяемый toolchain",
              "Текущая версия исходников: **0.9.0** · классические расширенные правила + локальная игра и четыре уровня компьютера + отзывчивые ходы ИИ через Web Worker + улучшенная обратная связь/навигация поля + PWA/доступность + воспроизводимый проверяемый toolchain"
          )
          replace_once(
              "README_RU.md",
              "Компьютерный соперник полностью локальный и работает без сети. Он не использует сервер, внешний API, ML-модель, аналитику или случайность. `src/game/ai.ts` получает авторитетный `GameState`, а каждый рассматриваемый ход проверяется через то же игровое ядро, что и ход человека.",
              "Компьютерный соперник полностью локальный и работает без сети. Он не использует сервер, внешний API, ML-модель, аналитику или случайность. `src/game/ai.ts` остаётся чистым потребителем авторитетного `GameState`; в браузере потенциально тяжёлый поиск теперь выполняется в отменяемом Web Worker, а полученная координата всё равно принимается только через штатный `playMove()`."
          )
          replace_once(
              "README_RU.md",
              "- **Клавиатура:** сфокусируйте поле, стрелками перемещайте курсор по пересечениям, **Enter / Пробел** ставит точку, **+ / -** меняют масштаб.\n- Viewport восстанавливается отдельно от партии. Новая игра возвращает поле к `(0, 0)` и масштабу 100%.",
              "- **Клавиатура:** сфокусируйте поле, стрелками перемещайте курсор по пересечениям, **Enter / Пробел** ставит точку, **+ / -** меняют масштаб.\n- **Наведение мыши** показывает точное пересечение, к которому привяжется клик.\n- **Показать игру** центрирует и масштабирует viewport так, чтобы вся сыгранная позиция была видна, не меняя игровых координат.\n- Последний ход отмечается тонким кольцом, а недопустимая постановка — коротким визуальным маркером.\n- Viewport восстанавливается отдельно от партии. Новая игра возвращает поле к `(0, 0)` и масштабу 100%."
