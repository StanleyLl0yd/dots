              "│   ├── ai.ts              чистый многоуровневый стратегический поиск компьютера\n│   ├── ai-worker.ts       browser Worker entry для изолированного расчёта ИИ\n│   ├── ai-worker-protocol.ts  типизированный Worker protocol\n│   ├── ai-match.ts        детерминированный AI-vs-AI regression harness"
          )
          replace_once(
              "README_RU.md",
              "└── verify-build.mjs       проверка production PWA-артефактов",
              "└── verify-build.mjs       проверка production PWA/AI-worker артефактов"
          )
          replace_once(
              "README_RU.md",
              "`npm run build` включает TypeScript-проверку, production-сборку Vite/PWA и постпроверку сгенерированных PWA-артефактов.",
              "`npm run build` включает TypeScript-проверку, production-сборку Vite/PWA и постпроверку сгенерированных PWA- и AI Web Worker-артефактов."
          )

          replace_once(
              "docs/PRODUCT.md",
              "Version **0.8.1** keeps the four selectable strengths introduced in 0.7.0, the strategic analysis added in 0.8.0, and hardens concrete Expert tactical decisions without creating a second rules engine. Version **0.8.2** is toolchain-only and does not alter these AI contracts.",
              "Version **0.8.1** keeps the four selectable strengths introduced in 0.7.0, the strategic analysis added in 0.8.0, and hardens concrete Expert tactical decisions without creating a second rules engine. Version **0.8.2** is toolchain-only. Version **0.9.0** leaves AI search decisions unchanged and moves browser-side computation into a cancellable Web Worker so long Expert calculations do not occupy the UI thread."
          )
          replace_once(
              "docs/PRODUCT.md",
              "- **New game** resets the board and asks for confirmation when a game is in progress.",
              "- **New game** resets the board and uses an accessible in-app confirmation dialog when a game is in progress."
          )
          replace_once(
              "docs/PRODUCT.md",
              "- Keyboard focus exposes an integer intersection cursor. Arrow keys move it one grid step, Enter/Space attempt placement, and plus/minus zoom around that cursor.\n- The keyboard cursor is kept visible by presentation-only viewport recentering.",
              "- Keyboard focus exposes an integer intersection cursor. Arrow keys move it one grid step, Enter/Space attempt placement, and plus/minus zoom around that cursor.\n- Desktop mouse hover previews the integer intersection that a click would submit; the preview never declares legality.\n- **Fit game** derives a bounded viewport from the coordinates of placed stones and recenters/scales presentation so the played position is visible.\n- The latest legal move may be marked visually from session history; this marker is not game state.\n- The keyboard cursor is kept visible by presentation-only viewport recentering."
          )
          replace_once(
              "docs/PRODUCT.md",
              "- A pending computer turn should not continue consuming work while the page is hidden; if Blue is still to move, scheduling resumes when the app returns to the foreground.",
              "- Browser computer search runs in a dedicated Web Worker. Pending work is cancellable on Undo, New game, mode/difficulty change, page hide, or replacement by a newer generation; if Blue is still to move after cancellation, scheduling resumes when appropriate."
          )
          replace_once(
              "docs/PRODUCT.md",
              "Version **0.8.2** supports the planned classic local game, browser/PWA/accessibility stack, strategically refined four-level computer opponent, fixed-position tactical regression coverage, and a reproducible audited development/deployment toolchain:",
              "Version **0.9.0** supports the planned classic local game, browser/PWA/accessibility stack, strategically refined four-level computer opponent, fixed-position tactical regression coverage, responsive Worker-isolated computer turns, polished game feedback/navigation, and a reproducible audited development/deployment toolchain:"
          )
          replace_once(
              "docs/PRODUCT.md",
              "- exact Undo semantics for local mode and full human decision rollback in computer mode;\n- confirmed New game;",
