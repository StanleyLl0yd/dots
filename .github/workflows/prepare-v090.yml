              "## Preference migration",
              "## Browser Worker isolation\n\n`src/game/ai.ts` remains browser-independent. Version 0.9.0 changes only orchestration: `main.ts` starts `src/game/ai-worker.ts` as a dedicated Web Worker and sends a structured-cloned `GameState`, focus point, player, difficulty, and request generation through `ai-worker-protocol.ts`. JavaScript structured clone preserves the state's `Map` data; a regression test locks down that transport assumption.\n\nThe Worker returns only the generation and proposed coordinate (or an error). The browser rejects stale generations and still calls `playMove()` before the move can enter session history or persistence. Undo, New game, mode/difficulty changes, page hide, and hidden-document transitions can terminate the active Worker. If Blue remains to move after a legitimate cancellation, normal foreground scheduling starts a fresh calculation.\n\nThis isolation keeps long Hard/Expert calculations off the UI thread without changing search depth, evaluation, deterministic tie-breaking, tactical benchmarks, or any game rule. Production verification requires a generated `ai-worker-*.js` asset so Worker isolation cannot silently disappear from a successful build.\n\n## Preference migration"
