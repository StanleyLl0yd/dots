name: Refactor audit

on:
  push:
    branches:
      - refactor/full-audit-0.9.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Verify native dependency lock
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps >/dev/null
      - name: Validate workflow YAML
        run: npx --yes prettier@3.6.2 .github/workflows/*.yml >/dev/null
      - name: Baseline repository statistics
        shell: bash
        run: |
          echo "tracked_files=$(git ls-files | wc -l)"
          echo "source_files=$(find src -type f \( -name '*.ts' -o -name '*.css' \) | wc -l)"
          echo "source_lines=$(find src -type f \( -name '*.ts' -o -name '*.css' \) -print0 | xargs -0 cat | wc -l)"
          echo "typescript_lines=$(find src -type f -name '*.ts' -print0 | xargs -0 cat | wc -l)"
          echo "css_lines=$(find src -type f -name '*.css' -print0 | xargs -0 cat | wc -l)"
          echo "test_files=$(find src -type f -name '*.test.ts' | wc -l)"
          node --input-type=module -e 'import p from "./package.json" with { type: "json" }; console.log(`direct_dependencies=${Object.keys(p.dependencies ?? {}).length + Object.keys(p.devDependencies ?? {}).length}`)'
      - name: Repository markers
        shell: bash
        run: |
          echo '--- TODO/FIXME/HACK/XXX ---'
          grep -RInE 'TODO|FIXME|HACK|XXX' --exclude=package-lock.json --exclude-dir=.git . || true
          echo '--- console calls ---'
          grep -RInE 'console\.(log|debug|warn|error)' src scripts vite.config.ts || true
          echo '--- package tree ---'
          npm ls --depth=0
      - name: Unused files and dependencies
        run: npx --yes knip@5.82.1 --no-progress --include files,dependencies,devDependencies,binaries --exclude exports
      - name: TypeScript unused exports
        run: npx --yes ts-prune@0.10.3
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - name: Diff hygiene
        run: git diff --check
      - name: Production statistics
        shell: bash
        run: |
          echo "dist_bytes=$(du -sb dist | cut -f1)"
          find dist -type f -printf '%s %p\n' | sort -nr
