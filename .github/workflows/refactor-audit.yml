name: Refactor audit

on:
  push:
    branches:
      - refactor/full-audit-0.10.0
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run verify:dependencies
      - run: npm run verify:version
      - run: npm ci
      - name: Verify Rust dependency locks
        run: |
          cargo metadata --format-version 1 --manifest-path crates/game-core/Cargo.toml --locked --no-deps >/dev/null
          cargo metadata --format-version 1 --manifest-path src-tauri/Cargo.toml --locked --no-deps >/dev/null
      - name: Install RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        run: |
          cargo audit --deny warnings --file crates/game-core/Cargo.lock
          cargo audit --deny unsound --deny yanked --ignore RUSTSEC-2024-0429 --file src-tauri/Cargo.lock
      - name: Verify Rust advisory exception scope
        run: bash scripts/verify-rust-advisory-scope.sh
      - name: Audit authoritative Rust core
        run: |
          cargo test --manifest-path crates/game-core/Cargo.toml --locked
          cargo clippy --manifest-path crates/game-core/Cargo.toml --all-targets --locked -- -D warnings
      - name: Validate workflow YAML
        run: npx --yes prettier@3.6.2 .github/workflows/*.yml >/dev/null
      - name: Baseline repository statistics
        shell: bash
        run: |
          echo "tracked_files=$(git ls-files | wc -l)"
          echo "source_files=$(find src -type f \( -name '*.ts' -o -name '*.css' \) | wc -l)"
          echo "source_lines=$(find src -type f \( -name '*.ts' -o -name '*.css' \) -print0 | xargs -0 cat | wc -l)"
          echo "typescript_lines=$(find src -type f -name '*.ts' -print0 | xargs -0 cat | wc -l)"
          echo "css_lines=$(find src -type f -name '*.css' -print0 | xargs -0 cat | wc -l)"
          echo "test_files=$(find src -type f -name '*.test.ts' | wc -l)"
          node --input-type=module -e 'import p from "./package.json" with { type: "json" }; console.log(`direct_dependencies=${Object.keys(p.dependencies ?? {}).length + Object.keys(p.devDependencies ?? {}).length}`)'
      - name: Repository markers
        shell: bash
        run: |
          echo '--- TODO/FIXME/HACK/XXX ---'
          git grep -nE 'TODO|FIXME|HACK|XXX' -- ':!package-lock.json' || true
          echo '--- console calls ---'
          git grep -nE 'console\.(log|debug|warn|error)' -- src scripts vite.config.ts || true
          echo '--- package tree ---'
          npm ls --depth=0
      - name: TypeScript unused exports
        run: npx --yes ts-prune@0.10.3
      - run: npm audit --audit-level=high
      - name: Configure Rust WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          sudo apt-get update
          sudo apt-get install -y binaryen
      - run: npm test
      - run: npm run build
      - name: Diff hygiene
        run: git diff --check
      - name: Production statistics
        shell: bash
        run: |
          echo "dist_bytes=$(du -sb dist | cut -f1)"
          find dist -type f -printf '%s %p\n' | sort -nr

  knip-files:
    name: Knip / unused files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run verify:dependencies
      - run: npm run verify:version
      - run: npm ci
      - name: Declare non-standard entry points
        run: |
          cat > .knip-audit.json <<'JSON'
          {
            "entry": [
              "src/main.ts",
              "src/about.ts",
              "src/game/core-native.ts",
              "src/game/core-test.ts",
              "scripts/capture-rustore-android.mjs"
            ]
          }
          JSON
      - run: npx --yes knip@5.82.1 --config .knip-audit.json --no-progress --include files

  knip-dependencies:
    name: Knip / unused dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run verify:dependencies
      - run: npm run verify:version
      - run: npm ci
      - run: npx --yes knip@5.82.1 --no-progress --include dependencies

  knip-dev-dependencies:
    name: Knip / unused devDependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run verify:dependencies
      - run: npm run verify:version
      - run: npm ci
      - run: npx --yes knip@5.82.1 --no-progress --include devDependencies

  knip-binaries:
    name: Knip / unused binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run verify:dependencies
      - run: npm run verify:version
      - run: npm ci
      - run: npx --yes knip@5.82.1 --no-progress --include binaries
