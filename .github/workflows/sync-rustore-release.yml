name: Sync RuStore Lock

on:
  push:
    branches:
      - release/dots-0.9.3-rustore-aab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/dots-0.9.3-rustore-aab

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify package lock
        run: |
          test "$(node -p "require('./package.json').version")" = "0.9.3"
          test "$(node -p "require('./package-lock.json').version")" = "0.9.3"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "0.9.3"
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build

      - name: Commit synchronized lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/sync-rustore-release.yml
          git commit -m "release: synchronize 0.9.3 package lock"
          git push origin HEAD:release/dots-0.9.3-rustore-aab
