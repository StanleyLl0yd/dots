name: Migrate frontend to Rust core

on:
  push:
    branches:
      - hardening/rust-game-core-0.9.3
    paths:
      - .github/workflows/migrate-frontend-core.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply frontend migration
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('src/main.ts')
          text = main_path.read_text(encoding='utf-8')

          old_imports = '''import AiWorker from "./game/ai-worker?worker";
          import type { AiDifficulty } from "./game/ai";
          import type { AiWorkerRequest, AiWorkerResponse } from "./game/ai-worker-protocol";'''.replace('          ', '')
          new_imports = '''import AiWorker from "./game/ai-worker?worker";
          import { isNativeGameCore, requestAiMove, type AiDifficulty } from "./game/core";
          import type { AiWorkerRequest, AiWorkerResponse } from "./game/ai-worker-protocol";'''.replace('          ', '')
          if text.count(old_imports) != 1:
              raise SystemExit('unexpected main import block')
          text = text.replace(old_imports, new_imports)

          old_session = 'let session = storage ? loadSession(storage) ?? createSession() : createSession();'
          new_session = 'let session = (storage ? await loadSession(storage) : undefined) ?? await createSession();'
          if text.count(old_session) != 1:
              raise SystemExit('unexpected session initialization')
          text = text.replace(old_session, new_session)

          thinking = 'let computerThinking = false;'
          if text.count(thinking) != 1:
              raise SystemExit('unexpected computerThinking declaration')
          text = text.replace(thinking, thinking + '\nlet stateMutationInFlight = false;')

          schedule_start = text.index('const scheduleComputerMove = (): void => {')
          schedule_end = text.index('\n\nboard = new CanvasBoard', schedule_start)
          schedule = '''const applyComputerProposal = async (generation: number, move: Point | undefined): Promise<void> => {
            if (generation !== computerGeneration || !isComputerTurn()) return;
            if (!isPoint(move)) {
              fallBackToLocalMode();
              return;
            }

            const baseSession = session;
            const next = await playMove(baseSession, move);
            if (generation !== computerGeneration || session !== baseSession) return;
            if (next === baseSession) {
              fallBackToLocalMode();
              return;
            }
            applyMove(next, move, true);
          };

          const scheduleComputerMove = (): void => {
            if (document.visibilityState === "hidden" || !isComputerTurn() || computerThinking) return;
            const generation = ++computerGeneration;
            computerThinking = true;
            renderStatus();
            announce(copy.computerThinking);

            computerTimer = window.setTimeout(() => {
              computerTimer = undefined;
              if (generation !== computerGeneration) return;
              if (!isComputerTurn()) {
                computerThinking = false;
                renderStatus();
                return;
              }

              const options = {
                player: COMPUTER_PLAYER,
                focus: session.history.at(-1)?.placed,
                difficulty: aiDifficulty
              };

              if (isNativeGameCore) {
                void requestAiMove(session.state, options)
                  .then((move) => applyComputerProposal(generation, move))
                  .catch(() => {
                    if (generation === computerGeneration && isComputerTurn()) fallBackToLocalMode();
                  });
                return;
              }

              let worker: Worker;
              try {
                worker = new AiWorker();
              } catch {
                fallBackToLocalMode();
                return;
              }
              computerWorker = worker;

              const finishWorker = (): void => {
                if (computerWorker === worker) computerWorker = undefined;
                worker.terminate();
              };

              worker.onmessage = (event: MessageEvent<AiWorkerResponse>) => {
                finishWorker();
                if (generation !== computerGeneration) return;
                const response = event.data;
                if (response.requestId !== generation || response.error) {
                  fallBackToLocalMode();
                  return;
                }
                void applyComputerProposal(generation, response.move).catch(() => {
                  if (generation === computerGeneration && isComputerTurn()) fallBackToLocalMode();
                });
              };

              worker.onerror = () => {
                finishWorker();
                if (generation === computerGeneration && isComputerTurn()) fallBackToLocalMode();
              };

              const request: AiWorkerRequest = {
                requestId: generation,
                state: session.state,
                options
              };

              try {
                worker.postMessage(request);
              } catch {
                finishWorker();
                fallBackToLocalMode();
              }
            }, COMPUTER_DELAY_MS);
          };'''.replace('          ', '')
          text = text[:schedule_start] + schedule + text[schedule_end:]

          old_on_point = '''  onPoint: (point) => {
            if (isComputerTurn()) {
              announce(copy.waitComputer);
              scheduleComputerMove();
              return false;
            }

            const next = playMove(session, point);
            if (next === session) {
              board.showInvalidPoint(point);
              announce(pointMessage(copy.unavailable, point));
              return false;
            }
            applyMove(next, point, false);
            scheduleComputerMove();
            return true;
          }'''.replace('          ', '')
          new_on_point = '''  onPoint: async (point) => {
            if (isComputerTurn()) {
              announce(copy.waitComputer);
              scheduleComputerMove();
              return false;
            }
            if (stateMutationInFlight) return false;

            stateMutationInFlight = true;
            try {
              const baseSession = session;
              const next = await playMove(baseSession, point);
              if (session !== baseSession) return false;
              if (next === baseSession) {
                board.showInvalidPoint(point);
                announce(pointMessage(copy.unavailable, point));
                return false;
              }
              applyMove(next, point, false);
              scheduleComputerMove();
              return true;
            } finally {
              stateMutationInFlight = false;
            }
          }'''.replace('          ', '')
          if text.count(old_on_point) != 1:
              raise SystemExit('unexpected onPoint block')
          text = text.replace(old_on_point, new_on_point)

          undo_start = text.index('undo.addEventListener("click", () => {')
          undo_end = text.index('\n\nconst resetGame', undo_start)
          undo_block = '''undo.addEventListener("click", () => {
            void (async () => {
              if (stateMutationInFlight) return;
              stateMutationInFlight = true;
              try {
                cancelComputerMove();
                const baseSession = session;
                let previous = await undoMove(baseSession);
                if (session !== baseSession) return;
                if (previous === baseSession) {
                  renderStatus();
                  return;
                }

                if (gameMode === "computer" && previous.state.currentPlayer === COMPUTER_PLAYER && previous.history.length > 0) {
                  previous = await undoMove(previous);
                }

                session = previous;
                persist();
                board.setState(session.state, lastMove());
                clearGameFeedback();
                renderStatus();
                scheduleComputerMove();
              } finally {
                stateMutationInFlight = false;
              }
            })();
          });'''.replace('          ', '')
          text = text[:undo_start] + undo_block + text[undo_end:]

          reset_start = text.index('const resetGame = (): void => {')
          reset_end = text.index('\n\nnewGame.addEventListener', reset_start)
          reset_block = '''const resetGame = async (): Promise<void> => {
            if (stateMutationInFlight) return;
            stateMutationInFlight = true;
            try {
              cancelComputerMove();
              session = await resetSession();
              persist();
              board.setState(session.state);
              board.resetViewport();
              clearGameFeedback();
              renderStatus();
            } finally {
              stateMutationInFlight = false;
            }
          };'''.replace('          ', '')
          text = text[:reset_start] + reset_block + text[reset_end:]

          text = text.replace('''  if (session.history.length === 0) {
            resetGame();
            return;
          }'''.replace('          ', ''), '''  if (session.history.length === 0) {
            void resetGame();
            return;
          }'''.replace('          ', ''), 1)
          text = text.replace('if (newGameDialog.returnValue === "confirm") resetGame();', 'if (newGameDialog.returnValue === "confirm") void resetGame();', 1)

          main_path.write_text(text, encoding='utf-8')

          canvas_path = Path('src/ui/canvas-board.ts')
          canvas = canvas_path.read_text(encoding='utf-8')
          old_type = 'onPoint: (point: Point) => boolean;'
          if canvas.count(old_type) != 1:
              raise SystemExit('unexpected CanvasBoard onPoint type')
          canvas = canvas.replace(old_type, 'onPoint: (point: Point) => boolean | Promise<boolean>;')
          canvas_path.write_text(canvas, encoding='utf-8')
          PY
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.ts src/ui/canvas-board.ts
          git diff --cached --check
          git commit -m "refactor: route frontend gameplay through Rust core"
          git push
