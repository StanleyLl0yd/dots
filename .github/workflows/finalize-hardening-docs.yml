name: Finalize hardening docs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-hardening-docs.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update release documentation and remove helpers
        shell: python
        run: |
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_required(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f"missing expected text: {label}")
              return text.replace(old, new, 1)

          ru = read("README_RU.md")
          ru = replace_required(ru, "source-0.8.1-16A34A", "source-0.8.2-16A34A", "RU badge")
          ru = replace_required(
              ru,
              "Текущая версия исходников: **0.8.1** · классические расширенные правила окружений + локальная игра вдвоём + стратегически усиленный компьютер с четырьмя уровнями + обратимая партия + практически неограниченное поле + PWA/доступность",
              "Текущая версия исходников: **0.8.2** · классические расширенные правила окружений + локальная игра вдвоём + стратегически усиленный компьютер с четырьмя уровнями + обратимая партия + практически неограниченное поле + PWA/доступность + воспроизводимый проверяемый toolchain",
              "RU current version",
          )
          ru = replace_required(
              ru,
              "Версия 0.8.1 сохраняет стратегическую модель ветки 0.8 и закрывает конкретные тактические слабости, найденные фиксированными эталонными позициями. «Эксперт» теперь шире, но ограниченно проверяет корневые ходы через настоящее игровое ядро, не входит в чужой домик с немедленным самозахватом при наличии безопасной альтернативы и отдаёт приоритет безопасному немедленному захвату. Анализ замыканий, локальной опасности и коротких угроз остаётся эвристикой; допустимость хода и счёт определяет только `placeStone()`.",
              "Версия 0.8.1 сохраняет стратегическую модель ветки 0.8 и закрывает конкретные тактические слабости, найденные фиксированными эталонными позициями. «Эксперт» теперь шире, но ограниченно проверяет корневые ходы через настоящее игровое ядро, не входит в чужой домик с немедленным самозахватом при наличии безопасной альтернативы и отдаёт приоритет безопасному немедленному захвату. Анализ замыканий, локальной опасности и коротких угроз остаётся эвристикой; допустимость хода и счёт определяет только `placeStone()`. Версия 0.8.2 не меняет игровое поведение или решения ИИ.",
              "RU AI baseline",
          )
          ru = replace_required(
              ru,
              "- детерминированные парные AI-vs-AI проверки силы и шесть фиксированных тактических позиций «Эксперта»;",
              "- детерминированные парные AI-vs-AI проверки силы и шесть фиксированных тактических позиций «Эксперта»;\n- зафиксированный `package-lock.json` и воспроизводимая установка через `npm ci` в CI и GitHub Pages;\n- обязательный `npm audit --audit-level=high`, блокирующий high/critical уязвимости; сейчас audit сообщает ноль уязвимостей;\n- GitHub Actions `checkout/setup-node` на Node-24-compatible runtime и Dependabot для npm и GitHub Actions;",
              "RU hardening bullets",
          )
          ru = replace_required(
              ru,
              "Версия **0.8.1** закрывает первые тактические слабости, обнаруженные фиксированным набором позиций «Эксперта». Дальнейшие изменения ИИ также должны начинаться с конкретных слабых позиций или результатов регрессионных матчей, а не с неограниченного увеличения глубины.",
              "Версия **0.8.2** — технический hardening-релиз. Он закрывает уязвимости dev-toolchain и делает разрешение/проверку зависимостей воспроизводимыми, не меняя правила игры, сохранения, UI или решения ИИ.",
              "RU release paragraph",
          )
          ru = replace_required(ru, "| Сборка | Vite 7 |", "| Сборка | Vite 7.3.6 |", "RU Vite")
          ru = replace_required(ru, "| Тесты | Vitest + проверка артефактов сборки |", "| Тесты | Vitest 3.2.7 + проверка артефактов сборки |", "RU Vitest")
          ru = replace_required(ru, "| Хостинг | GitHub Pages |", "| Зависимости | зафиксированный npm lockfile + `npm ci` + high/critical audit gate |\n| Хостинг | GitHub Pages |", "RU deps row")
          ru = replace_required(ru, "cd dots\nnpm install\nnpm run dev", "cd dots\nnpm ci\nnpm run dev", "RU install")
          ru = replace_required(ru, "```bash\nnpm test\nnpm run build\n```", "```bash\nnpm audit --audit-level=high\nnpm test\nnpm run build\n```", "RU verification")
          write("README_RU.md", ru)

          agents = read("AGENTS.md")
          agents = replace_required(
              agents,
              "- Do not introduce a dependency without a concrete need.",
              "- Do not introduce a dependency without a concrete need.\n- Keep `package-lock.json` committed and synchronized with `package.json` whenever package metadata or dependencies change.\n- Use `npm ci` for CI and GitHub Pages so automated verification uses the committed dependency graph rather than re-resolving versions.\n- Keep `npm audit --audit-level=high` as a CI release gate. High or critical advisories must block release unless an exceptional, explicitly documented risk decision is approved.\n- Keep GitHub Actions on maintained Node-24-compatible action versions and keep Dependabot coverage for both npm and GitHub Actions.",
              "AGENTS dependency rules",
          )
          write("AGENTS.md", agents)

          security = read("SECURITY.md")
          security = replace_required(
              security,
              "## Reporting a vulnerability",
              "## Dependency hygiene\n\nThe repository commits `package-lock.json` and uses `npm ci` in CI and GitHub Pages for reproducible installs. CI runs `npm audit --audit-level=high` before tests and production build; high or critical dependency advisories fail verification. Dependabot monitors both npm packages and GitHub Actions.\n\n## Reporting a vulnerability",
              "SECURITY dependency section",
          )
          write("SECURITY.md", security)

          arch = read("docs/ARCHITECTURE.md")
          arch = replace_required(
              arch,
              "## Regression and operational verification",
              "## Toolchain and dependency reproducibility\n\n`package-lock.json` (lockfile v3) is committed and must stay synchronized with `package.json`. CI and GitHub Pages install with `npm ci`, so automated verification uses the exact committed dependency graph. `package.json` requires Node.js 22 or newer.\n\nCI runs `npm audit --audit-level=high` before tests and production build; high or critical dependency advisories fail the job. GitHub workflows use maintained Node-24-compatible checkout/setup actions, and Dependabot monitors both npm dependencies and GitHub Actions monthly. This tooling/security layer is operational only and cannot affect authoritative game state.\n\n## Regression and operational verification",
              "ARCH toolchain section",
          )
          arch = replace_required(
              arch,
              "- TypeScript validation and the complete Vite/PWA production build;",
              "- reproducible `npm ci` dependency installation plus a high/critical `npm audit` gate;\n- TypeScript validation and the complete Vite/PWA production build;",
              "ARCH verification bullet",
          )
          arch = replace_required(
              arch,
              "Version **0.8.1** hardens the strategic AI-quality phase with fixed tactical positions, wider bounded root discovery, hostile-house safety, and explicit safe immediate-capture priority for Expert. Further AI work should continue from concrete failing positions or measured match regressions rather than unbounded depth increases.",
              "Version **0.8.2** is a toolchain/security hardening release: patched Vite/Vitest advisories, reproducible lockfile-based installs, an enforced high/critical audit gate, and maintained GitHub Actions runtimes. Game rules, persistence formats, UI behavior, PWA lifecycle, accessibility, and AI search/benchmark contracts are unchanged from 0.8.1.",
              "ARCH closing version",
          )
          write("docs/ARCHITECTURE.md", arch)

          product = read("docs/PRODUCT.md")
          product = replace_required(
              product,
              "Version **0.8.1** keeps the four selectable strengths introduced in 0.7.0, the strategic analysis added in 0.8.0, and hardens concrete Expert tactical decisions without creating a second rules engine.",
              "Version **0.8.1** keeps the four selectable strengths introduced in 0.7.0, the strategic analysis added in 0.8.0, and hardens concrete Expert tactical decisions without creating a second rules engine. Version **0.8.2** is toolchain-only and does not alter these AI contracts.",
              "PRODUCT AI version",
          )
          product = replace_required(
              product,
              "Version **0.8.1** supports the planned classic local game, browser/PWA/accessibility stack, and strategically refined four-level computer opponent with fixed-position tactical regression coverage:",
              "Version **0.8.2** supports the planned classic local game, browser/PWA/accessibility stack, strategically refined four-level computer opponent, fixed-position tactical regression coverage, and a reproducible audited development/deployment toolchain:",
              "PRODUCT current version",
          )
          product = replace_required(
              product,
              "- AI regression tests covering all four search profiles and a 300-stone Expert position.",
              "- AI regression tests covering all four search profiles and a 300-stone Expert position;\n- committed npm lockfile, `npm ci` in CI/Pages, high/critical npm audit gating, maintained Node-24-compatible GitHub Actions, and Dependabot coverage for npm plus GitHub Actions.",
              "PRODUCT hardening status",
          )
          product = replace_required(
              product,
              "### Phase 6 — optional refinement and Android packaging",
              "### Phase 5.4 — technical/toolchain hardening — complete in 0.8.2\n\n- patched Vite and Vitest versions that clear the high/critical advisories reported against the previous toolchain;\n- committed lockfile v3 and reproducible `npm ci` installs;\n- mandatory high/critical npm audit gate before tests/build in CI;\n- maintained Node-24-compatible checkout/setup GitHub Actions;\n- Dependabot coverage for both npm and GitHub Actions.\n\n### Phase 6 — optional refinement and Android packaging",
              "PRODUCT phase 5.4",
          )
          product = replace_required(
              product,
              "- Production builds must fail if required PWA/offline install artifacts are missing.",
              "- Production builds must fail if required PWA/offline install artifacts are missing.\n- `package-lock.json` must remain committed and synchronized with package metadata/dependencies; CI and Pages must use `npm ci`.\n- High or critical dependency advisories must fail CI through `npm audit --audit-level=high` unless an explicit approved risk exception exists.\n- GitHub Actions used for checkout/runtime setup must remain on maintained Node-24-compatible releases, with automated dependency monitoring enabled.",
              "PRODUCT dependency invariants",
          )
          write("docs/PRODUCT.md", product)

          ai = read("docs/AI.md")
          ai = replace_required(
              ai,
              "Version **0.8.1** keeps the bounded strategic model from 0.8.0 and closes the first concrete tactical gaps exposed by the fixed-position suite: missed multi-target immediate capture, self-capturing entry into an opponent house, and defensive blocking when a safe counter-capture is the stronger forced choice. Root tactical discovery/safety now handles these cases before deeper Expert minimax comparison.",
              "Version **0.8.1** keeps the bounded strategic model from 0.8.0 and closes the first concrete tactical gaps exposed by the fixed-position suite: missed multi-target immediate capture, self-capturing entry into an opponent house, and defensive blocking when a safe counter-capture is the stronger forced choice. Root tactical discovery/safety now handles these cases before deeper Expert minimax comparison. Version **0.8.2** is toolchain-only and leaves this AI behavior and all benchmark expectations unchanged.",
              "AI current strength note",
          )
          write("docs/AI.md", ai)

          Path(".github/workflows/sync-lock.yml").unlink(missing_ok=True)
          Path(".github/workflows/finalize-hardening-docs.yml").unlink(missing_ok=True)
      - name: Commit synchronized text files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README_RU.md AGENTS.md SECURITY.md docs/ARCHITECTURE.md docs/PRODUCT.md docs/AI.md .github/workflows
          git diff --cached --quiet || git commit -m "docs: finalize 0.8.2 hardening documentation"
          git push
