name: Finalize hardening documentation

on:
  push:
    branches:
      - hardening/rust-game-core-0.9.3
    paths:
      - .github/workflows/finalize-hardening-docs.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Synchronize architecture documentation
        run: python scripts/finalize-hardening-docs.py
      - name: Commit synchronized documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/finalize-hardening-docs.yml scripts/finalize-hardening-docs.py
          git add AGENTS.md README.md README_RU.md docs/ARCHITECTURE.md docs/AI.md crates/game-core/src/regression_tests.rs
          git diff --cached --check
          git commit -m "docs: align repository with shared Rust game core"
          git push
