name: Finalize hardening documentation

on:
  push:
    branches:
      - hardening/rust-game-core-0.9.3
    paths:
      - .github/workflows/finalize-hardening-docs.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Synchronize architecture documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected {label} occurrence count: {text.count(old)}")
              return text.replace(old, new, 1)

          regression = Path('crates/game-core/src/regression_tests.rs')
          text = regression.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'fn expert_search_is_bounded_on_large_sparse_position() {\n    let stones: Vec<Stone> = (0..300)',
              'fn expert_search_stays_legal_on_sparse_position() {\n    let stones: Vec<Stone> = (0..90)',
              'large sparse AI smoke test'
          )
          regression.write_text(text, encoding='utf-8')

          agents = Path('AGENTS.md')
          text = agents.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '- Keep `src/game/ai.ts` free of DOM, Canvas, viewport, storage, service-worker, and network dependencies. AI behavior must remain usable offline and independently testable from the browser shell.',
              '- Keep the authoritative rules, capture/scoring engine, replay validation, and AI search in `crates/game-core`. TypeScript may provide DTO/session/transport/Worker orchestration only and must not reintroduce a parallel rules or AI implementation. AI behavior must remain usable offline and independently testable from the browser shell.',
              'AGENTS Rust core rule'
          )
          agents.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '[![TypeScript](https://img.shields.io/badge/TypeScript-5.9-2563EB?labelColor=2b2925&logo=typescript&logoColor=ffffff)](https://www.typescriptlang.org/)',
              '[![TypeScript](https://img.shields.io/badge/TypeScript-5.9-2563EB?labelColor=2b2925&logo=typescript&logoColor=ffffff)](https://www.typescriptlang.org/)\n[![Rust](https://img.shields.io/badge/Rust-game--core-B7410E?labelColor=2b2925&logo=rust&logoColor=ffffff)](https://www.rust-lang.org/)',
              'README Rust badge'
          )
          text = replace_once(
              text,
              'The computer opponent is completely local and offline. It does not use a server, external API, machine-learning model, analytics, or randomness. `src/game/ai.ts` remains browser-independent; the browser now executes its potentially expensive search in a cancellable Web Worker, and every returned coordinate is still accepted only through the authoritative `playMove()` path.',
              'The computer opponent is completely local and offline. It does not use a server, external API, machine-learning model, analytics, or randomness. Rules, scoring, replay validation, and AI search live in the shared Rust `crates/game-core`; the browser executes the WASM-backed search in a cancellable Web Worker, and every returned coordinate is still accepted through the authoritative Rust move path.',
              'README AI implementation paragraph'
          )
          text = replace_once(
              text,
              'The repository includes a deterministic `src/game/ai-match.ts` harness. CI runs short paired **Expert vs Normal** and **Expert vs Hard** games with color assignment swapped. Expert must not lose either paired comparison and must keep a positive aggregate captured-score margin. A separate six-position `ai-tactical-benchmark.test.ts` suite locks down concrete Expert decisions including double captures, house safety, counter-capture, threat blocking, and capture-of-capture release. These are tactical regression guards, not an Elo rating or a hardware benchmark.',
              'The Rust regression suite runs short paired **Expert vs Normal** and **Expert vs Hard** games with color assignment swapped. Expert must not lose either paired comparison and must keep a positive aggregate captured-score margin. Six fixed Rust tactical regressions lock down concrete Expert decisions including double captures, house safety, counter-capture, threat blocking, and capture-of-capture release. These are tactical regression guards, not an Elo rating or a hardware benchmark.',
              'README AI regression paragraph'
          )
          text = text.replace(
              '- complete classic local rule engine separated from Canvas and browser UI;',
              '- authoritative Rust game core shared by native Tauri and web/PWA via WASM, separated from Canvas and browser UI;'
          )
          text = text.replace(
              '| Language | TypeScript 5.9 |',
              '| Languages | Rust game core + TypeScript 5.9 UI/orchestration |'
          )
          text = text.replace(
              '| AI | deterministic bounded strategic minimax over the game core, executed in a browser Web Worker |',
              '| AI | deterministic bounded Rust minimax; native direct call, browser WASM in a Web Worker |'
          )
          arch_pattern = re.compile(r'## 🗂 Architecture\n\n```text\n.*?```\n\nSee ', re.S)
          arch_replacement = '''## 🗂 Architecture

```text
crates/game-core/                 authoritative Rust rules/capture/replay/AI core
├── src/board.rs
├── src/capture.rs
├── src/ai.rs
├── src/types.rs
└── src/wasm.rs                   four coarse WASM exports

src/game/                         thin TypeScript boundary only
├── core.ts                       DTO conversion + shared frontend API
├── core-web.ts                   lazy Rust/WASM transport
├── core-native.ts                four Tauri IPC calls
├── ai-worker.ts                  cancellable browser AI orchestration
├── session.ts                    move-log history over Rust core
└── types.ts                      rendering-facing DTO types

src/ui/                           Canvas input/rendering + viewport only
src-tauri/                        Tauri shell linking the same game-core crate
scripts/                          WASM build + source/artifact hardening verification
```

See '''
          text, count = arch_pattern.subn(arch_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'unexpected README architecture section count: {count}')
          text = text.replace(
              'See [`docs/ARCHITECTURE.md`](docs/ARCHITECTURE.md), [`docs/AI.md`](docs/AI.md), and [`CHANGELOG.md`](CHANGELOG.md).',
              'See [`docs/ARCHITECTURE.md`](docs/ARCHITECTURE.md), [`docs/AI.md`](docs/AI.md), [`docs/HARDENING.md`](docs/HARDENING.md), and [`CHANGELOG.md`](CHANGELOG.md).'
          )
          text = replace_once(
              text,
              'Requirements: Node.js 22+ and npm.',
              'Requirements: Node.js 22+, npm, Rust with the `wasm32-unknown-unknown` target, `wasm-bindgen-cli` 0.2.127, and Binaryen (`wasm-opt`).',
              'README development requirements'
          )
          text = replace_once(
              text,
              '`npm run build` includes TypeScript validation, the Vite/PWA production build, and post-build verification of generated PWA and AI Web Worker artifacts.',
              '`npm run dev`, `npm test`, and `npm run build` generate the ignored Rust/WASM output automatically. Production build verification rejects source maps, TypeScript/test leakage, legacy game-core identifiers, and missing PWA/WASM/Worker assets.',
              'README build description'
          )
          readme.write_text(text, encoding='utf-8')

          readme_ru = Path('README_RU.md')
          text = readme_ru.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '[![TypeScript](https://img.shields.io/badge/TypeScript-5.9-2563EB?labelColor=2b2925&logo=typescript&logoColor=ffffff)](https://www.typescriptlang.org/)',
              '[![TypeScript](https://img.shields.io/badge/TypeScript-5.9-2563EB?labelColor=2b2925&logo=typescript&logoColor=ffffff)](https://www.typescriptlang.org/)\n[![Rust](https://img.shields.io/badge/Rust-game--core-B7410E?labelColor=2b2925&logo=rust&logoColor=ffffff)](https://www.rust-lang.org/)',
              'README_RU Rust badge'
          )
          text = replace_once(
              text,
              'Компьютерный соперник полностью локальный и работает без сети. Он не использует сервер, внешний API, ML-модель, аналитику или случайность. `src/game/ai.ts` остаётся независимым от браузера; потенциально тяжёлый поиск теперь выполняется в отменяемом Web Worker, а полученная координата по-прежнему принимается только через авторитетный `playMove()`.',
              'Компьютерный соперник полностью локальный и работает без сети. Он не использует сервер, внешний API, ML-модель, аналитику или случайность. Правила, счёт, replay-проверка и поиск ИИ находятся в общем Rust-крейте `crates/game-core`; браузер выполняет WASM-поиск в отменяемом Web Worker, а полученная координата принимается только через авторитетный Rust-путь хода.',
              'README_RU AI implementation paragraph'
          )
          text = replace_once(
              text,
              'В репозитории есть детерминированный `src/game/ai-match.ts`. CI проводит короткие парные матчи **«Эксперт» против «Обычного»** и **«Эксперт» против «Сложного»** со сменой цветов. «Эксперт» не должен проигрывать ни одно парное сравнение и должен сохранять положительный суммарный перевес по захваченным точкам. Отдельный набор из шести фиксированных позиций `ai-tactical-benchmark.test.ts` проверяет двойной захват, безопасность домика, контрзахват, обязательные блокировки и окружение окружения. Это регрессионные проверки тактики, а не рейтинг Elo и не тест скорости оборудования.',
              'Rust-набор регрессий проводит короткие парные матчи **«Эксперт» против «Обычного»** и **«Эксперт» против «Сложного»** со сменой цветов. «Эксперт» не должен проигрывать ни одно парное сравнение и должен сохранять положительный суммарный перевес по захваченным точкам. Шесть фиксированных Rust-позиций проверяют двойной захват, безопасность домика, контрзахват, обязательные блокировки и окружение окружения. Это регрессионные проверки тактики, а не рейтинг Elo и не тест скорости оборудования.',
              'README_RU AI regression paragraph'
          )
          text = text.replace(
              '- полное классическое локальное игровое ядро отдельно от Canvas и browser UI;',
              '- авторитетное Rust-ядро, общее для native Tauri и web/PWA через WASM, отдельно от Canvas и browser UI;'
          )
          text = text.replace(
              '| Язык | TypeScript 5.9 |',
              '| Языки | Rust game core + TypeScript 5.9 UI/orchestration |'
          )
          text = text.replace(
              '| ИИ | детерминированный ограниченный стратегический minimax поверх игрового ядра, выполняемый в browser Web Worker |',
              '| ИИ | детерминированный ограниченный Rust minimax; native-вызов напрямую, browser WASM в Web Worker |'
          )
          arch_pattern_ru = re.compile(r'## 🗂 Архитектура\n\n```text\n.*?```\n\nПодробнее', re.S)
          arch_replacement_ru = '''## 🗂 Архитектура

```text
crates/game-core/                 авторитетные Rust rules/capture/replay/AI
├── src/board.rs
├── src/capture.rs
├── src/ai.rs
├── src/types.rs
└── src/wasm.rs                   четыре крупных WASM-экспорта

src/game/                         только тонкая TypeScript-граница
├── core.ts                       DTO + единый frontend API
├── core-web.ts                   Rust/WASM transport
├── core-native.ts                четыре Tauri IPC-вызова
├── ai-worker.ts                  отменяемая browser AI orchestration
├── session.ts                    история move-log поверх Rust core
└── types.ts                      DTO для rendering

src/ui/                           Canvas/input/viewport
src-tauri/                        Tauri shell с тем же game-core crate
scripts/                          WASM build + source/artifact verification
```

Подробнее'''
          text, count = arch_pattern_ru.subn(arch_replacement_ru, text, count=1)
          if count != 1:
              raise SystemExit(f'unexpected README_RU architecture section count: {count}')
          text = text.replace(
              '[`docs/ARCHITECTURE.md`](docs/ARCHITECTURE.md), [`docs/AI.md`](docs/AI.md) и [`CHANGELOG.md`](CHANGELOG.md)',
              '[`docs/ARCHITECTURE.md`](docs/ARCHITECTURE.md), [`docs/AI.md`](docs/AI.md), [`docs/HARDENING.md`](docs/HARDENING.md) и [`CHANGELOG.md`](CHANGELOG.md)'
          )
          text = text.replace(
              'Требования: Node.js 22+ и npm.',
              'Требования: Node.js 22+, npm, Rust с target `wasm32-unknown-unknown`, `wasm-bindgen-cli` 0.2.127 и Binaryen (`wasm-opt`).'
          )
          readme_ru.write_text(text, encoding='utf-8')

          architecture = Path('docs/ARCHITECTURE.md')
          text = architecture.read_text(encoding='utf-8')
          layers = re.compile(r'## Layers\n\n```text\n.*?```\n\n.*?\n\n## Capture and move engine', re.S)
          layers_replacement = '''## Layers

```text
crates/game-core/                 authoritative Rust rules, captures, replay, and AI
src/game/core.ts                  DTO conversion and common frontend API
src/game/core-web.ts              lazy WASM transport
src/game/core-native.ts           four coarse Tauri IPC calls
src/game/ai-worker.ts             cancellable browser-only AI orchestration
src/game/session.ts               move-log history over Rust replay/apply
src/ui/                           Canvas input/rendering and viewport math
src/persistence.ts                versioned move-log storage adapter
src-tauri/                        native shell linking crates/game-core
```

`crates/game-core` is the only production authority for move legality, capture/house topology, release/scoring, replay validation, and AI search. Rendering consumes confirmed state and never decides captures. TypeScript owns DTO conversion, session history, persistence transport, preferences, Worker scheduling, and UI only. Native Tauri links the crate directly; web/PWA uses the same crate through optimized WASM. See `docs/HARDENING.md` for the release boundary and artifact checks.

## Capture and move engine'''
          text, count = layers.subn(layers_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'unexpected architecture Layers section count: {count}')
          text = text.replace(
              '`src/game/ai.ts` is a deterministic bounded-search module. It accepts `GameState` plus optional search options, including `AiDifficulty`, and returns a proposed integer `Point` or `undefined`. It imports only game-core modules.',
              '`crates/game-core/src/ai.rs` is the deterministic bounded-search implementation. It accepts authoritative `GameState` plus bounded options and returns only a proposed integer `Point`; every simulation uses the same Rust move/capture engine.'
          )
          text = text.replace('Every `chooseAiMove()` call', 'Every `choose_ai_move()` call')
          text = text.replace(
              '`src/game/ai-match.ts` provides a pure deterministic test/analysis harness. It starts from `createGameState()`, optionally applies a legal opening, then alternates `chooseAiMove()` for Red/Blue and feeds every proposal back through `placeStone()`.',
              '`crates/game-core/src/regression_tests.rs` contains the deterministic AI-vs-AI harness. It alternates Rust `choose_ai_move()` for Red/Blue and feeds every proposal back through Rust `place_stone()`.'
          )
          session_pattern = re.compile(r'## Session history and persistence adapters\n\n.*?\n\n`src/storage.ts`', re.S)
          session_replacement = '''## Session history and persistence adapters

`src/game/session.ts` keeps only the ordered placed-point history around authoritative Rust state. Legal moves call Rust apply; Undo removes one move from the log and rebuilds state through Rust replay, so player, active captures, releases, and derived score are restored by the same core instead of by a parallel TypeScript rollback implementation.

`src/storage.ts`'''
          text, count = session_pattern.subn(session_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'unexpected architecture session section count: {count}')
          text = text.replace(
              'Version 0.9.0 keeps `src/game/ai.ts` pure and runs browser AI computation through `src/game/ai-worker.ts`.',
              'Browser builds run the shared Rust/WASM AI through `src/game/ai-worker.ts`; native Tauri calls the linked Rust core directly without a browser Worker.'
          )
          text = text.replace(
              'Stress coverage includes a 500-move sparse reversible game, an 8K/minimum-zoom visible-grid bound, 2,000 repeated pan/zoom transforms, Expert AI legality search over a 300-stone sparse position, short deterministic AI-vs-AI strength regressions, and the six fixed Expert tactical positions.',
              'Stress coverage includes a 100-move WASM-backed sparse reversible session, an 8K/minimum-zoom visible-grid bound, 2,000 repeated pan/zoom transforms, bounded sparse-position Expert search plus explicit 300-stone search-profile checks, short deterministic AI-vs-AI strength regressions, and six fixed Expert tactical positions.'
          )
          architecture.write_text(text, encoding='utf-8')

          ai = Path('docs/AI.md')
          text = ai.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '`src/game/ai.ts` is pure TypeScript and imports no DOM, Canvas, storage, network, or service-worker APIs.',
              '`crates/game-core/src/ai.rs` is the sole production AI implementation. It is Rust, shares the authoritative move/capture engine, and has no DOM, Canvas, storage, network, or service-worker dependency.',
              'AI search model implementation'
          )
          text = text.replace('Every `chooseAiMove()` call', 'Every `choose_ai_move()` call')
          text = replace_once(
              text,
              '`src/game/ai-match.ts` provides a pure deterministic AI-vs-AI harness used only for tests and analysis. It applies every generated move back through `placeStone()` and can run paired matches with the stronger level once as Red and once as Blue.',
              '`crates/game-core/src/regression_tests.rs` contains the deterministic AI-vs-AI harness used by Rust regression tests. It applies every generated move back through `place_stone()` and runs paired matches with the stronger level once as Red and once as Blue.',
              'AI strength harness'
          )
          text = replace_once(
              text,
              '`src/game/ai-tactical-benchmark.test.ts` contains six deterministic fixed Expert positions. They cover a two-target immediate capture, a mandatory one-point threat block, rejecting a tempting empty false closure, avoiding a hostile empty house, choosing counter-capture when two independent threats cannot both be blocked, and surrounding an active capture to release a held stone.',
              '`crates/game-core/src/regression_tests.rs` contains six deterministic fixed Expert tactical positions. They cover a two-target immediate capture, a mandatory one-point threat block, rejecting a tempting empty false closure, avoiding a hostile empty house, choosing counter-capture when two independent threats cannot both be blocked, and surrounding an active capture to release a held stone.',
              'AI tactical suite'
          )
          text = replace_once(
              text,
              'Version **0.9.0** changes browser orchestration, not AI policy. `main.ts` starts `src/game/ai-worker.ts` as a dedicated Web Worker and sends a structured-cloned `GameState`, focus point, player, difficulty, and request generation through `ai-worker-protocol.ts`. Structured clone preserves the state\'s `Map`; a regression test locks down that transport assumption.',
              'Browser orchestration runs `src/game/ai-worker.ts` as a dedicated Web Worker. The Worker receives a structured-cloned rendering-facing `GameState` plus focus/player/difficulty and delegates the full search to the shared Rust/WASM core; native Tauri calls the same Rust core directly. The Worker remains transport/orchestration only.',
              'AI Worker implementation'
          )
          ai.write_text(text, encoding='utf-8')
          PY
      - name: Commit synchronized documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/finalize-hardening-docs.yml
          git add AGENTS.md README.md README_RU.md docs/ARCHITECTURE.md docs/AI.md crates/game-core/src/regression_tests.rs
          git diff --cached --check
          git commit -m "docs: align repository with shared Rust game core"
          git push
