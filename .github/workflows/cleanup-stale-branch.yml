name: Cleanup stale branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-stale-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/cleanup-repo"
