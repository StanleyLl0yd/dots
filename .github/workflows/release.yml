name: Publish GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - CHANGELOG.md
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - id: status
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.status.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const version = process.env.VERSION;
          const changelog = readFileSync("CHANGELOG.md", "utf8");
          const lines = changelog.split(/\r?\n/);
          const start = lines.findIndex((line) => line.startsWith(`## [${version}]`));
          if (start < 0) throw new Error(`Missing CHANGELOG section for ${version}`);
          let end = lines.findIndex((line, index) => index > start && line.startsWith("## ["));
          if (end < 0) end = lines.length;
          const notes = lines.slice(start + 1, end).join("\n").trim();
          if (!notes) throw new Error(`Empty CHANGELOG section for ${version}`);
          writeFileSync("release-notes.md", `${notes}\n`);
          NODE
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Dots $TAG" --notes-file release-notes.md
