name: Publish GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - CHANGELOG.md
      - vite.config.ts
      - src/**
      - crates/game-core/**
      - branding/**
      - scripts/prepare-icon-assets.mjs
      - scripts/build-game-core-wasm.mjs
      - scripts/verify-build.mjs
      - scripts/verify-source-boundary.mjs
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Configure Rust WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          sudo apt-get update
          sudo apt-get install -y binaryen
      - run: cargo test --manifest-path crates/game-core/Cargo.toml --locked
      - run: npm test
      - run: npm run build

      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: status
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.status.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const version = process.env.VERSION;
          const changelog = readFileSync("CHANGELOG.md", "utf8");
          const lines = changelog.split(/\r?\n/);
          const start = lines.findIndex((line) => line.startsWith(`## [${version}]`));
          if (start < 0) throw new Error(`Missing CHANGELOG section for ${version}`);
          let end = lines.findIndex((line, index) => index > start && line.startsWith("## ["));
          if (end < 0) end = lines.length;
          const notes = lines.slice(start + 1, end).join("\n").trim();
          if (!notes) throw new Error(`Empty CHANGELOG section for ${version}`);
          writeFileSync("release-notes.md", `${notes}\n`);
          NODE
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Dots $TAG" --notes-file release-notes.md
