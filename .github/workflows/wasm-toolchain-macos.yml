name: macOS WASM toolchain

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - rust-toolchain.toml
      - crates/game-core/**
      - scripts/build-game-core-wasm.mjs
      - scripts/wasm-toolchain.mjs
      - .github/workflows/wasm-toolchain-macos.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - rust-toolchain.toml
      - crates/game-core/**
      - scripts/build-game-core-wasm.mjs
      - scripts/wasm-toolchain.mjs
      - .github/workflows/wasm-toolchain-macos.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run verify:dependencies
      - run: npm run verify:version
      - run: npm run verify:workflows
      - run: npm ci
      - run: npm test
