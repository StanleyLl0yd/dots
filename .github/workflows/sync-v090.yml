name: Sync v0.9.0

on:
  push:
    paths:
      - scripts/sync-v090.mjs
      - .github/workflows/sync-v090.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/sync-v090.mjs
      - name: Commit synchronized state
        run: |
          rm scripts/sync-v090.mjs .github/workflows/sync-v090.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: synchronize 0.9.0 UX release"
          git push
