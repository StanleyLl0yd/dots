name: Finalize 0.8.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-081.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Synchronize release metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const read = (path) => readFileSync(path, "utf8");
          const write = (path, text) => writeFileSync(path, text);
          const replaceRequired = (text, from, to, label) => {
            if (!text.includes(from)) throw new Error(`Missing ${label}`);
            return text.replace(from, to);
          };

          const packageJson = JSON.parse(read("package.json"));
          if (packageJson.version !== "0.8.0") throw new Error(`Unexpected package version ${packageJson.version}`);
          packageJson.version = "0.8.1";
          write("package.json", `${JSON.stringify(packageJson, null, 2)}\n`);

          let changelog = read("CHANGELOG.md");
          const changelogMarker = "## [0.8.0] - 2026-08-31";
          const releaseNotes = `## [0.8.1] - 2026-08-31

### Added

- fixed-position Expert tactical benchmark suite covering a two-target capture, mandatory threat blocking, false-closure rejection, hostile-house avoidance, counter-capture under double threat, and capture-of-capture release;
- all six tactical fixtures now run as required regressions instead of keeping the three discovered weaknesses as skipped known gaps.

### Fixed

- Expert now converts the available two-target immediate capture instead of allowing heuristic shortlist/search preference to choose a quiet move;
- Expert avoids entering an opponent empty house when that move would activate the house and a safe legal frontier move exists;
- Expert prefers its own safe immediate counter-capture when independent opponent threats cannot all be neutralized by one defensive move.

### Changed

- Hard/Expert root candidate discovery performs a wider but bounded authoritative \`placeStone()\` pre-scan so real score-changing moves cannot be hidden solely by heuristic seed ordering;
- Expert gives safe immediate captures explicit root tactical priority before deeper minimax comparison while keeping legality, houses, captures, releases, and score authoritative to the game core;
- repository AI/product/architecture documentation and both READMEs now describe the tactical benchmark contract and the 0.8.1 root-safety policy;
- source version advanced to 0.8.1.

`;
          changelog = replaceRequired(changelog, changelogMarker, `${releaseNotes}${changelogMarker}`, "CHANGELOG 0.8.0 marker");
          write("CHANGELOG.md", changelog);

          let readme = read("README.md");
          readme = readme.replaceAll("0.8.0", "0.8.1");
          readme = replaceRequired(
            readme,
            "Version 0.8.1 improves **quality rather than blindly increasing depth**. Hard and Expert now recognize frontier points that can close an already connected same-color path, use those signals to build capture/house pressure or occupy an opponent closing point, estimate local danger around active stones, and run bounded authoritative probes for immediate captures and short setup plans. Actual capture legality and scoring still come only from `placeStone()`.",
            "Version 0.8.1 keeps the strategic 0.8 search model and closes concrete tactical gaps exposed by fixed benchmark positions. Expert now performs wider bounded authoritative root discovery, rejects an immediately self-capturing entry into an opponent house when a safe alternative exists, and gives safe immediate captures root priority. Hard and Expert still use cycle-closing pressure, local danger, and bounded authoritative threat/setup probes; actual legality and scoring still come only from `placeStone()`.",
            "README AI version paragraph"
          );
          readme = replaceRequired(
            readme,
            "The repository includes a deterministic `src/game/ai-match.ts` harness. CI runs short paired **Expert vs Normal** and **Expert vs Hard** games with color assignment swapped. Expert must not lose either paired comparison and must keep a positive aggregate captured-score margin. These are tactical regression guards, not an Elo rating or a hardware benchmark.",
            "The repository includes a deterministic `src/game/ai-match.ts` harness. CI runs short paired **Expert vs Normal** and **Expert vs Hard** games with color assignment swapped. Expert must not lose either paired comparison and must keep a positive aggregate captured-score margin. A separate six-position `ai-tactical-benchmark.test.ts` suite locks down concrete Expert decisions including double captures, house safety, counter-capture, threat blocking, and capture-of-capture release. These are tactical regression guards, not an Elo rating or a hardware benchmark.",
            "README regression paragraph"
          );
          readme = replaceRequired(
            readme,
            "- deterministic AI-vs-AI paired strength regression tests;",
            "- deterministic AI-vs-AI paired strength regression tests plus six fixed Expert tactical benchmark positions;",
            "README current build AI regression bullet"
          );
          readme = replaceRequired(
            readme,
            "Version **0.8.1** completes the strategic AI-quality phase. Further AI changes should start from concrete failing positions or measured match regressions rather than unbounded depth increases.",
            "Version **0.8.1** closes the first tactical gaps found by the fixed Expert benchmark suite. Further AI changes should continue to start from concrete failing positions or measured match regressions rather than unbounded depth increases.",
            "README closing version paragraph"
          );
          readme = replaceRequired(
            readme,
            "│   ├── ai-match.test.ts   paired strength regression tests\n",
            "│   ├── ai-match.test.ts   paired strength regression tests\n│   ├── ai-tactical-benchmark.test.ts  fixed Expert tactical positions\n",
            "README architecture AI tests"
          );
          write("README.md", readme);

          let readmeRu = read("README_RU.md");
          readmeRu = readmeRu.replaceAll("0.8.0", "0.8.1");
          readmeRu = replaceRequired(
            readmeRu,
            "Версия 0.8.1 усиливает **качество решений, а не просто глубину**. «Сложный» и «Эксперт» теперь распознают свободные точки, способные замкнуть уже связанный путь своих точек, используют это для построения давления вокруг будущего окружения/домика или блокировки вероятной точки замыкания соперника, оценивают локальную уязвимость активных точек и выполняют ограниченные проверки немедленных захватов и коротких подготовительных планов. Сам факт окружения, допустимость хода и счёт по-прежнему определяет только `placeStone()`.",
            "Версия 0.8.1 сохраняет стратегическую модель ветки 0.8 и закрывает конкретные тактические слабости, найденные фиксированными эталонными позициями. «Эксперт» теперь шире, но ограниченно проверяет корневые ходы через настоящее игровое ядро, не входит в чужой домик с немедленным самозахватом при наличии безопасной альтернативы и отдаёт приоритет безопасному немедленному захвату. Анализ замыканий, локальной опасности и коротких угроз остаётся эвристикой; допустимость хода и счёт определяет только `placeStone()`.",
            "README_RU AI version paragraph"
          );
          readmeRu = replaceRequired(
            readmeRu,
            "В репозитории есть детерминированный `src/game/ai-match.ts`. CI проводит короткие парные матчи **«Эксперт» против «Обычного»** и **«Эксперт» против «Сложного»** со сменой цветов. «Эксперт» не должен проигрывать ни одно парное сравнение и должен сохранять положительный суммарный перевес по захваченным точкам. Это регрессионная проверка тактики, а не рейтинг Elo и не тест скорости оборудования.",
            "В репозитории есть детерминированный `src/game/ai-match.ts`. CI проводит короткие парные матчи **«Эксперт» против «Обычного»** и **«Эксперт» против «Сложного»** со сменой цветов. «Эксперт» не должен проигрывать ни одно парное сравнение и должен сохранять положительный суммарный перевес по захваченным точкам. Отдельный набор из шести фиксированных позиций `ai-tactical-benchmark.test.ts` проверяет двойной захват, безопасность домика, контрзахват, обязательные блокировки и окружение окружения. Это регрессионные проверки тактики, а не рейтинг Elo и не тест скорости оборудования.",
            "README_RU regression paragraph"
          );
          readmeRu = replaceRequired(
            readmeRu,
            "- детерминированные парные AI-vs-AI регрессионные проверки силы;",
            "- детерминированные парные AI-vs-AI проверки силы и шесть фиксированных тактических позиций «Эксперта»;",
            "README_RU current build AI regression bullet"
          );
          readmeRu = replaceRequired(
            readmeRu,
            "Версия **0.8.1** завершает этап стратегического усиления ИИ. Следующие изменения ИИ должны начинаться с конкретных слабых позиций или результатов регрессионных матчей, а не с неограниченного увеличения глубины.",
            "Версия **0.8.1** закрывает первые тактические слабости, обнаруженные фиксированным набором позиций «Эксперта». Дальнейшие изменения ИИ также должны начинаться с конкретных слабых позиций или результатов регрессионных матчей, а не с неограниченного увеличения глубины.",
            "README_RU closing version paragraph"
          );
          readmeRu = replaceRequired(
            readmeRu,
            "│   ├── ai-match.test.ts   парные регрессионные проверки силы\n",
            "│   ├── ai-match.test.ts   парные регрессионные проверки силы\n│   ├── ai-tactical-benchmark.test.ts  фиксированные тактические позиции «Эксперта»\n",
            "README_RU architecture AI tests"
          );
          write("README_RU.md", readmeRu);

          let ai = read("docs/AI.md");
          ai = replaceRequired(
            ai,
            "4. Validate shortlisted moves by applying them through `placeStone()`; illegal points and captured territory are rejected by the same core used for human moves.\n5. Evaluate real score/capture state plus secondary structure, local stone danger, and near-cycle pressure.",
            "4. On Hard/Expert, use a wider but bounded root pre-scan through `placeStone()` before the expensive strategic search so real score-changing moves are not hidden solely by heuristic seed order.\n5. Validate retained moves through `placeStone()`; illegal points and captured territory are rejected by the same core used for human moves.\n6. Evaluate real score/capture state plus secondary structure, local stone danger, and near-cycle pressure."
              + "\n7. On Expert, discard immediately self-capturing root moves when at least one safe candidate exists and give safe immediate captures root tactical priority."
              + "\n8. On Hard and Expert, probe a bounded set of authoritative immediate capture threats for both sides and short setup sequences that can create a capture opportunity on the attacker's next turn."
              + "\n9. Search alternating real turns with deterministic minimax and alpha-beta pruning over the depth enabled by the selected difficulty."
              + "\n10. At the nominal horizon, Hard/Expert may selectively continue only forcing score-changing capture/release moves instead of blindly increasing full-tree depth."
              + "\n11. Reuse equivalent searched positions through per-move evaluation/transposition caches.",
            "AI search model steps"
          );
          ai = ai.replace("6. On Hard and Expert, probe a bounded set of authoritative immediate capture threats for both sides and short setup sequences that can create a capture opportunity on the attacker's next turn.\n7. Search alternating real turns with deterministic minimax and alpha-beta pruning over the depth enabled by the selected difficulty.\n8. At the nominal horizon, Hard/Expert may selectively continue only forcing score-changing capture/release moves instead of blindly increasing full-tree depth.\n9. Reuse equivalent searched positions through per-move evaluation/transposition caches.\n", "");
          const strengthMarker = "## Preference migration\n";
          const tacticalSection = `## Tactical benchmark suite

\`src/game/ai-tactical-benchmark.test.ts\` contains six deterministic fixed Expert positions. They cover a two-target immediate capture, a mandatory one-point threat block, rejecting a tempting empty false closure, avoiding a hostile empty house, choosing counter-capture when two independent threats cannot both be blocked, and surrounding an active capture to release a held stone.

All six are required tests in 0.8.1. A position discovered as a real AI weakness may be introduced as an explicit known gap during investigation, but a released fix must promote it to an ordinary required regression rather than weakening the expected result.

`;
          ai = replaceRequired(ai, strengthMarker, `${tacticalSection}${strengthMarker}`, "AI preference marker");
          ai = replaceRequired(
            ai,
            "Version **0.8.0** adds measured tactical quality rather than another blanket depth increase: cycle-closing/house pressure, local stone-danger evaluation, bounded immediate and setup threat probes, improved move ordering, alpha-beta pruning, forcing-capture horizon extensions, and deterministic AI-vs-AI strength regression matches.",
            "Version **0.8.1** keeps the bounded strategic model from 0.8.0 and closes the first concrete tactical gaps exposed by the fixed-position suite: missed multi-target immediate capture, self-capturing entry into an opponent house, and defensive blocking when a safe counter-capture is the stronger forced choice. Root tactical discovery/safety now handles these cases before deeper Expert minimax comparison."
          , "AI current strength version");
          write("docs/AI.md", ai);

          let product = read("docs/PRODUCT.md");
          product = product.replaceAll("Version **0.8.0**", "Version **0.8.1**");
          product = replaceRequired(
            product,
            "- Shortlisted candidates are validated and simulated through `placeStone()`. Houses, captures, capture-of-capture, releases, blocked territory, and score therefore remain authoritative game-core behavior.",
            "- Hard/Expert use a wider bounded authoritative root pre-scan before expensive search so real score-changing moves are not lost solely to heuristic seed ordering; all retained candidates are still simulated through `placeStone()`. Houses, captures, capture-of-capture, releases, blocked territory, and score therefore remain authoritative game-core behavior.\n- Expert rejects a root move that immediately increases the opponent's score when at least one safe candidate exists, and safe immediate captures take root tactical priority before deeper comparison."
          , "PRODUCT AI shortlist invariant");
          product = replaceRequired(
            product,
            "- deterministic AI-vs-AI regression harness with paired Expert-vs-Normal/Hard strength guards;",
            "- deterministic AI-vs-AI regression harness with paired Expert-vs-Normal/Hard strength guards plus six fixed Expert tactical benchmark positions;",
            "PRODUCT current status AI regressions"
          );
          product = replaceRequired(
            product,
            "### Phase 6 — optional refinement and Android packaging",
            "### Phase 5.3 — tactical Expert hardening — complete in 0.8.1\n\n- six-position fixed tactical benchmark suite;\n- wider bounded authoritative root discovery for real scoring moves;\n- safe-root guard against immediate hostile-house self-capture;\n- safe immediate-capture priority for Expert;\n- all three benchmark-discovered gaps promoted from known gaps to required regressions.\n\n### Phase 6 — optional refinement and Android packaging",
            "PRODUCT Phase 6 marker"
          );
          write("docs/PRODUCT.md", product);

          let architecture = read("docs/ARCHITECTURE.md");
          architecture = replaceRequired(
            architecture,
            "│   ├── ai-match.test.ts\n",
            "│   ├── ai-match.test.ts\n│   ├── ai-tactical-benchmark.test.ts\n",
            "ARCHITECTURE AI test tree"
          );
          architecture = replaceRequired(
            architecture,
            "Every shortlisted coordinate is subsequently passed through `placeStone()`. Occupied, captured-territory, or otherwise illegal points are therefore rejected by the authoritative core.",
            "Every retained coordinate is subsequently passed through `placeStone()`. Hard/Expert perform a wider but bounded root pre-scan so real score-changing moves cannot be excluded solely by heuristic seed order. Occupied, captured-territory, or otherwise illegal points are rejected by the authoritative core.\n\nAt the Expert root, candidates that immediately increase the opponent's score are excluded when at least one safe candidate exists. Safe immediate captures take tactical priority before deeper minimax comparison. These are move-selection policies only; the score change used by the policy is still the result returned by `placeStone()`."
          , "ARCHITECTURE shortlisted coordinate paragraph");
          architecture = replaceRequired(
            architecture,
            "The CI suite deliberately uses short deterministic matches rather than a wall-clock benchmark. Expert must not lose the paired Expert-vs-Normal or Expert-vs-Hard comparisons and must maintain a positive aggregate captured-score margin across them. This is a regression guard, not an Elo claim.",
            "The CI suite deliberately uses short deterministic matches rather than a wall-clock benchmark. Expert must not lose the paired Expert-vs-Normal or Expert-vs-Hard comparisons and must maintain a positive aggregate captured-score margin across them. `ai-tactical-benchmark.test.ts` complements those matches with six fixed decisions covering immediate multi-capture, mandatory defense, false closure, hostile-house safety, counter-capture under double threat, and capture-of-capture release. These are regression guards, not Elo claims."
          , "ARCHITECTURE regression paragraph");
          architecture = replaceRequired(
            architecture,
            "Version **0.8.0** completes the strategic AI-quality phase: enclosure pressure, local danger, bounded short-horizon threat probes, stronger ordering, alpha-beta pruning, forcing horizon extensions, and strength-regression matches. Further AI work should start from concrete failing positions or measured match regressions rather than unbounded depth increases.",
            "Version **0.8.1** hardens the strategic AI-quality phase with fixed tactical positions, wider bounded root discovery, hostile-house safety, and explicit safe immediate-capture priority for Expert. Further AI work should continue from concrete failing positions or measured match regressions rather than unbounded depth increases."
          , "ARCHITECTURE closing version paragraph");
          write("docs/ARCHITECTURE.md", architecture);
          NODE

          rm .github/workflows/finalize-081.yml

      - name: Commit release
        run: |
          git diff --check
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add package.json CHANGELOG.md README.md README_RU.md docs/AI.md docs/PRODUCT.md docs/ARCHITECTURE.md .github/workflows/finalize-081.yml
          git commit -m "chore: release 0.8.1"
          git push
