name: Regenerate hardening locks

on:
  push:
    branches:
      - hardening/rust-game-core-0.9.3
    paths:
      - .github/workflows/regenerate-hardening-locks.yml

permissions:
  contents: write

jobs:
  locks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Update npm lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Create game core lock
        run: cargo generate-lockfile --manifest-path crates/game-core/Cargo.toml
      - name: Update native lock metadata
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null
      - name: Commit lock files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json crates/game-core/Cargo.lock src-tauri/Cargo.lock
          git diff --cached --check
          git commit -m "build: lock Rust core and Tauri API dependencies"
          git push
