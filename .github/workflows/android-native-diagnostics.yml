name: Android Native Diagnostics

on:
  push:
    branches:
      - fix/android-native-verifier-0.9.4-final
    paths:
      - .github/workflows/android-native-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-native:
    name: Android native diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: 0.9.4
      NDK_VERSION: 29.0.14206865
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.9.4
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Configure Android toolchain
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [[ ! -d "$NDK_PATH" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
          test -d "$NDK_PATH"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Restore Android upload key
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64"
          test -n "$ANDROID_UPLOAD_KEYSTORE_PASSWORD"
          test -n "$ANDROID_UPLOAD_KEY_ALIAS"
          test -n "$ANDROID_UPLOAD_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/dots-upload.keystore"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" -alias "$ANDROID_UPLOAD_KEY_ALIAS" >/dev/null
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Initialize Android wrapper
        run: |
          cargo tauri android init --ci
          cargo tauri icon public/pwa-192.png
          cp scripts/tauri-android-build.gradle.kts src-tauri/gen/android/app/build.gradle.kts
          python - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/gen/android/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          if 'ndkVersion = "29.0.14206865"' not in text:
              needle = '    compileSdk = 36\n'
              if needle not in text:
                  raise SystemExit('Unable to pin Android NDK: compileSdk marker not found')
              text = text.replace(needle, needle + '    ndkVersion = "29.0.14206865"\n', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Configure Android signing
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          export ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD KEYSTORE_PATH
          python - <<'PY'
          import os
          from pathlib import Path
          def prop(value: str) -> str:
              return value.replace('\\', '\\\\').replace('\r', '\\r').replace('\n', '\\n').replace('=', '\\=').replace(':', '\\:')
          Path('src-tauri/gen/android/keystore.properties').write_text('\n'.join([
              f"storePassword={prop(os.environ['ANDROID_UPLOAD_KEYSTORE_PASSWORD'])}",
              f"keyPassword={prop(os.environ['ANDROID_UPLOAD_KEY_PASSWORD'])}",
              f"keyAlias={prop(os.environ['ANDROID_UPLOAD_KEY_ALIAS'])}",
              f"storeFile={prop(os.environ['KEYSTORE_PATH'])}",
              '',
          ]), encoding='utf-8')
          PY

      - name: Build Android artifacts
        run: |
          cargo tauri android build --aab --target aarch64 --target armv7
          cargo tauri android build --apk --target aarch64 --target armv7
          mkdir -p release
          AAB="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print -quit)"
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*release*.apk' -print -quit)"
          test -f "$AAB"
          test -f "$APK"
          cp "$AAB" "release/Dots-v${VERSION}-Android.aab"
          cp "$APK" "release/Dots-v${VERSION}-Android-verification.apk"

      - name: Verify Android ZIP 16 KB alignment
        run: |
          APK="release/Dots-v${VERSION}-Android-verification.apk"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" >/dev/null

      - name: Verify Android ABI set
        run: |
          AAB="release/Dots-v${VERSION}-Android.aab"
          APK="release/Dots-v${VERSION}-Android-verification.apk"
          AAB="$AAB" APK="$APK" python - <<'PY'
          import os
          import zipfile
          expected = ['arm64-v8a', 'armeabi-v7a']
          def abis(path, prefix):
              with zipfile.ZipFile(path) as archive:
                  result = sorted({name.split('/')[2 if prefix == 'base/lib/' else 1]
                                   for name in archive.namelist()
                                   if name.startswith(prefix) and name.endswith('.so')})
              return result
          aab = abis(os.environ['AAB'], 'base/lib/')
          apk = abis(os.environ['APK'], 'lib/')
          if aab != expected:
              raise SystemExit(f'Unexpected AAB ABIs: {aab}; expected {expected}')
          if apk != expected:
              raise SystemExit(f'Unexpected APK ABIs: {apk}; expected {expected}')
          print('AAB ABIs:', ' '.join(aab))
          print('APK ABIs:', ' '.join(apk))
          PY

      - name: Prepare Android native libraries
        run: |
          AAB="release/Dots-v${VERSION}-Android.aab"
          APK="release/Dots-v${VERSION}-Android-verification.apk"
          TMP_NATIVE="$RUNNER_TEMP/native-libs"
          rm -rf "$TMP_NATIVE"
          mkdir -p "$TMP_NATIVE/aab" "$TMP_NATIVE/apk"
          unzip -q "$AAB" 'base/lib/*/*.so' -d "$TMP_NATIVE/aab"
          unzip -q "$APK" 'lib/*/*.so' -d "$TMP_NATIVE/apk"
          test -n "$(find "$TMP_NATIVE" -type f -name '*.so' -print -quit)"
          READELF="$(command -v readelf)"
          test -x "$READELF"
          echo "TMP_NATIVE=$TMP_NATIVE" >> "$GITHUB_ENV"
          echo "READELF=$READELF" >> "$GITHUB_ENV"

      - name: Verify Android ELF sections and exports
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path
          root = Path(os.environ['TMP_NATIVE'])
          readelf = os.environ['READELF']
          sensitive = re.compile(r'choose_ai_move|minimax|closure_pressure|setup_potential|find_new_captures|find_house_capture', re.I)
          libraries = sorted(root.rglob('*.so'))
          if not libraries:
              raise SystemExit('No native libraries found')
          for library in libraries:
              sections = subprocess.check_output([readelf, '-SW', str(library)], text=True)
              if re.search(r'\.(?:debug_|zdebug_|gdb_index)', sections):
                  raise SystemExit(f'Debug sections found in {library}')
              symbols = subprocess.check_output([readelf, '-sW', str(library)], text=True)
              if sensitive.search(symbols):
                  raise SystemExit(f'Sensitive game-core symbol exported by {library}')
          print(f'Checked {len(libraries)} native libraries')
          PY

      - name: Verify Android arm64 ELF 16 KB alignment
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          root = Path(os.environ['TMP_NATIVE'])
          readelf = os.environ['READELF']
          for artifact in ('aab/base/lib', 'apk/lib'):
              directory = root / artifact / 'arm64-v8a'
              if not directory.is_dir():
                  raise SystemExit(f'{directory}: arm64-v8a directory missing')
              libraries = sorted(directory.glob('*.so'))
              if not libraries:
                  raise SystemExit(f'{directory}: no native libraries found')
              for library in libraries:
                  output = subprocess.check_output([readelf, '-lW', str(library)], text=True)
                  aligns = []
                  for line in output.splitlines():
                      fields = line.split()
                      if fields and fields[0] == 'LOAD':
                          aligns.append(int(fields[-1], 0))
                  if not aligns or min(aligns) < 0x4000:
                      raise SystemExit(f'{library}: arm64 LOAD alignment is not 16 KB compatible: {aligns}')
                  print(f'{library}: LOAD alignments {[hex(value) for value in aligns]}')
          PY

      - name: Verify Android artifact leakage
        run: |
          AAB="release/Dots-v${VERSION}-Android.aab"
          APK="release/Dots-v${VERSION}-Android-verification.apk"
          AAB="$AAB" APK="$APK" python - <<'PY'
          import os
          import re
          import zipfile
          checks = [
              ('AAB', os.environ['AAB'], re.compile(r'^base/assets/.*\.(?:map|ts|tsx|rs)$'), 'source or source-map artifact'),
              ('APK', os.environ['APK'], re.compile(r'^assets/.*\.(?:map|ts|tsx|rs)$'), 'source or source-map artifact'),
          ]
          for label, path, pattern, description in checks:
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
              leaked = [name for name in names if pattern.search(name)]
              if leaked:
                  raise SystemExit(f'{description} leaked into {label}: {leaked[:10]}')
              wasm = [name for name in names if name.endswith('/game_core.wasm') or name == 'game_core.wasm']
              if wasm:
                  raise SystemExit(f'WebAssembly game core leaked into {label}: {wasm[:10]}')
          print('No source, source maps, Rust sources, or game_core.wasm leaked')
          PY

      - name: Verify Android bundle page alignment
        run: |
          AAB="release/Dots-v${VERSION}-Android.aab"
          BUNDLETOOL="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl --fail --location --silent --show-error --output "$BUNDLETOOL" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          printf '%s  %s\n' 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29' "$BUNDLETOOL" | sha256sum --check --status
          BUNDLE_CONFIG="$RUNNER_TEMP/bundle-config.txt"
          java -jar "$BUNDLETOOL" dump config --bundle="$AAB" > "$BUNDLE_CONFIG"
          python - "$BUNDLE_CONFIG" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text(encoding='utf-8')
          if 'PAGE_ALIGNMENT_16K' not in text:
              raise SystemExit('Bundle config does not declare PAGE_ALIGNMENT_16K')
          print('Bundle config declares PAGE_ALIGNMENT_16K')
          PY

      - name: Remove temporary Android signing material
        if: always()
        run: rm -f src-tauri/gen/android/keystore.properties "${KEYSTORE_PATH:-}"
