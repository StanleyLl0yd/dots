name: Native Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - vite.config.ts
      - src/**
      - crates/game-core/**
      - src-tauri/**
      - scripts/build-game-core-wasm.mjs
      - scripts/verify-build.mjs
      - scripts/tauri-android-build.gradle.kts
      - .github/workflows/native-release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and attach native artifacts to
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: native-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  android:
    name: Signed Android AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve release version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${DISPATCH_TAG:-v$VERSION}"
          test "$TAG" = "v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Pin existing release tag source
        if: github.event_name == 'push'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            EXPECTED="$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}')"
            if [ -z "$EXPECTED" ]; then
              EXPECTED="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
            fi
            git fetch --no-tags --depth=1 origin "refs/tags/$TAG"
            git checkout --detach FETCH_HEAD
            ACTUAL="$(git rev-parse HEAD)"
            test "$ACTUAL" = "$EXPECTED"
            echo "Pinned existing release source $TAG at $ACTUAL"
          fi

      - name: Install web dependencies
        run: npm ci

      - name: Verify native dependency locks
        run: |
          cargo metadata --manifest-path crates/game-core/Cargo.toml --locked --no-deps >/dev/null
          cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps >/dev/null

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Configure WASM test toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Run Rust core tests
        run: cargo test --manifest-path crates/game-core/Cargo.toml --locked

      - name: Run frontend tests against WASM core
        run: npm test

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Configure Android toolchain
        run: |
          NDK_PATH="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -d "$NDK_PATH"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Restore Android upload key
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64"
          test -n "$ANDROID_UPLOAD_KEYSTORE_PASSWORD"
          test -n "$ANDROID_UPLOAD_KEY_ALIAS"
          test -n "$ANDROID_UPLOAD_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/dots-upload.keystore"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" -alias "$ANDROID_UPLOAD_KEY_ALIAS" >/dev/null
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Initialize Android wrapper
        run: |
          cargo tauri android init --ci
          cargo tauri icon public/pwa-192.png
          cp scripts/tauri-android-build.gradle.kts src-tauri/gen/android/app/build.gradle.kts

      - name: Configure Android signing
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          export ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD KEYSTORE_PATH
          python - <<'PY'
          import os
          from pathlib import Path

          def prop(value: str) -> str:
              return value.replace('\\', '\\\\').replace('\r', '\\r').replace('\n', '\\n').replace('=', '\\=').replace(':', '\\:')

          Path('src-tauri/gen/android/keystore.properties').write_text('\n'.join([
              f"storePassword={prop(os.environ['ANDROID_UPLOAD_KEYSTORE_PASSWORD'])}",
              f"keyPassword={prop(os.environ['ANDROID_UPLOAD_KEY_PASSWORD'])}",
              f"keyAlias={prop(os.environ['ANDROID_UPLOAD_KEY_ALIAS'])}",
              f"storeFile={prop(os.environ['KEYSTORE_PATH'])}",
              '',
          ]), encoding='utf-8')
          PY

      - name: Build signed AAB
        run: |
          cargo tauri android build --aab
          mkdir -p release
          AAB="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print -quit)"
          test -f "$AAB"
          cp "$AAB" "release/Dots-v${VERSION}-Android.aab"

      - name: Build signed verification APK
        run: |
          cargo tauri android build --apk
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*release*.apk' -print -quit)"
          test -f "$APK"
          cp "$APK" "release/Dots-v${VERSION}-Android-verification.apk"

      - name: Verify signed Android artifacts and native hardening
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          AAB="release/Dots-v${VERSION}-Android.aab"
          APK="release/Dots-v${VERSION}-Android-verification.apk"
          test -f "$AAB"
          test -f "$APK"

          jarsigner -verify "$AAB"

          EXPECTED_CERT_LOG="$RUNNER_TEMP/expected-cert.txt"
          AAB_CERT_LOG="$RUNNER_TEMP/aab-cert.txt"
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" -alias "$ANDROID_UPLOAD_KEY_ALIAS" > "$EXPECTED_CERT_LOG" 2>&1
          keytool -printcert -jarfile "$AAB" > "$AAB_CERT_LOG"
          EXPECTED_CERT="$(sed -n 's/.*SHA256: //p' "$EXPECTED_CERT_LOG" | tr -d ':' | tr '[:upper:]' '[:lower:]' | sed -n '1p')"
          ACTUAL_AAB_CERT="$(sed -n 's/.*SHA256: //p' "$AAB_CERT_LOG" | tr -d ':' | tr '[:upper:]' '[:lower:]' | sed -n '1p')"
          test -n "$EXPECTED_CERT"
          test "$ACTUAL_AAB_CERT" = "$EXPECTED_CERT"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          test -x "$ZIPALIGN"

          APK_CERT_LOG="$RUNNER_TEMP/apk-cert.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$APK_CERT_LOG"
          ACTUAL_APK_CERT="$(sed -n 's/.*certificate SHA-256 digest: //p' "$APK_CERT_LOG" | tr -d ':' | tr '[:upper:]' '[:lower:]' | sed -n '1p')"
          test "$ACTUAL_APK_CERT" = "$EXPECTED_CERT"

          BADGING="$RUNNER_TEMP/android-badging.txt"
          "$AAPT" dump badging "$APK" > "$BADGING"
          grep -F "package: name='com.sl.dots'" "$BADGING"
          grep -F "versionName='${VERSION}'" "$BADGING"
          grep -F "sdkVersion:'24'" "$BADGING"
          grep -F "targetSdkVersion:'36'" "$BADGING"
          if grep -q '^application-debuggable' "$BADGING"; then
            echo "Release APK is debuggable" >&2
            exit 1
          fi

          MANIFEST_DUMP="$RUNNER_TEMP/android-manifest.txt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$MANIFEST_DUMP"
          if grep -Eq 'android:debuggable.*0xffffffff' "$MANIFEST_DUMP"; then
            echo "android:debuggable=true in release manifest" >&2
            exit 1
          fi
          if grep -Eq 'android:usesCleartextTraffic.*0xffffffff' "$MANIFEST_DUMP"; then
            echo "usesCleartextTraffic=true in release manifest" >&2
            exit 1
          fi

          APK_SIZE="$(stat -c%s "$APK")"
          if [ "$APK_SIZE" -ge 5368709120 ]; then
            echo "Release APK exceeds 5 GiB: $APK_SIZE bytes" >&2
            exit 1
          fi

          "$ZIPALIGN" -c -P 16 -v 4 "$APK" >/dev/null

          TMP_NATIVE="$RUNNER_TEMP/native-libs"
          rm -rf "$TMP_NATIVE"
          mkdir -p "$TMP_NATIVE/aab" "$TMP_NATIVE/apk"
          unzip -q "$AAB" 'base/lib/*/*.so' -d "$TMP_NATIVE/aab"
          unzip -q "$APK" 'lib/*/*.so' -d "$TMP_NATIVE/apk"

          AAB_ABIS="$(find "$TMP_NATIVE/aab/base/lib" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | paste -sd ' ' -)"
          APK_ABIS="$(find "$TMP_NATIVE/apk/lib" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | paste -sd ' ' -)"
          EXPECTED_ABIS="arm64-v8a armeabi-v7a x86 x86_64"
          test "$AAB_ABIS" = "$EXPECTED_ABIS"
          test "$APK_ABIS" = "$EXPECTED_ABIS"

          READELF="$(find "$NDK_HOME/toolchains/llvm/prebuilt" -type f -name llvm-readelf -print -quit)"
          NM="$(find "$NDK_HOME/toolchains/llvm/prebuilt" -type f -name llvm-nm -print -quit)"
          test -x "$READELF"
          test -x "$NM"

          while IFS= read -r so; do
            SECTIONS="$(mktemp "$RUNNER_TEMP/sections.XXXXXX")"
            SYMBOLS="$(mktemp "$RUNNER_TEMP/symbols.XXXXXX")"
            "$READELF" -SW "$so" > "$SECTIONS"
            "$NM" -D --defined-only "$so" > "$SYMBOLS" 2>/dev/null || true
            if grep -Eq '\.debug_(info|line|str|abbrev)' "$SECTIONS"; then
              echo "Debug sections found in $so" >&2
              exit 1
            fi
            if grep -Eiq 'choose_ai_move|minimax|closure_pressure|setup_potential|find_new_captures|find_house_capture' "$SYMBOLS"; then
              echo "Sensitive game-core symbol exported by $so" >&2
              exit 1
            fi
            rm -f "$SECTIONS" "$SYMBOLS"
          done < <(find "$TMP_NATIVE" -type f -name '*.so' -print)

          READELF="$READELF" TMP_NATIVE="$TMP_NATIVE" python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          readelf = os.environ['READELF']
          root = Path(os.environ['TMP_NATIVE'])
          for artifact in ('aab/base/lib', 'apk/lib'):
              libs_root = root / artifact
              for abi in ('arm64-v8a', 'x86_64'):
                  directory = libs_root / abi
                  if not directory.exists():
                      continue
                  for library in directory.glob('*.so'):
                      output = subprocess.check_output([readelf, '-lW', str(library)], text=True)
                      aligns = []
                      for line in output.splitlines():
                          fields = line.split()
                          if fields and fields[0] == 'LOAD':
                              aligns.append(int(fields[-1], 0))
                      if not aligns or min(aligns) < 0x4000:
                          raise SystemExit(f'{library}: 64-bit LOAD alignment is not 16 KB compatible: {aligns}')
          PY

          BUNDLETOOL="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl --fail --location --silent --show-error \
            --output "$BUNDLETOOL" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          printf '%s  %s\n' 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29' "$BUNDLETOOL" | sha256sum --check --status
          BUNDLE_CONFIG="$RUNNER_TEMP/bundle-config.txt"
          java -jar "$BUNDLETOOL" dump config --bundle="$AAB" > "$BUNDLE_CONFIG"
          grep -F 'PAGE_ALIGNMENT_16K' "$BUNDLE_CONFIG" >/dev/null

      - name: Remove temporary Android signing material
        if: always()
        run: rm -f src-tauri/gen/android/keystore.properties "${KEYSTORE_PATH:-}" release/Dots-v${VERSION}-Android-verification.apk

      - name: Attach AAB to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..30}; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" "release/Dots-v${VERSION}-Android.aab" --clobber

  macos:
    name: Universal macOS DMG
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve release version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${DISPATCH_TAG:-v$VERSION}"
          test "$TAG" = "v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Pin existing release tag source
        if: github.event_name == 'push'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            EXPECTED="$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}')"
            if [ -z "$EXPECTED" ]; then
              EXPECTED="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
            fi
            git fetch --no-tags --depth=1 origin "refs/tags/$TAG"
            git checkout --detach FETCH_HEAD
            ACTUAL="$(git rev-parse HEAD)"
            test "$ACTUAL" = "$EXPECTED"
            echo "Pinned existing release source $TAG at $ACTUAL"
          fi

      - name: Install web dependencies
        run: npm ci

      - name: Verify native dependency locks
        run: |
          cargo metadata --manifest-path crates/game-core/Cargo.toml --locked --no-deps >/dev/null
          cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps >/dev/null

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Configure WASM test toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          brew list binaryen >/dev/null 2>&1 || brew install binaryen

      - name: Run Rust core tests
        run: cargo test --manifest-path crates/game-core/Cargo.toml --locked

      - name: Run frontend tests against WASM core
        run: npm test

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Configure macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Generate native icons
        run: cargo tauri icon public/pwa-192.png

      - name: Build universal DMG
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: cargo tauri build --bundles dmg --target universal-apple-darwin

      - name: Verify and stage DMG
        run: |
          DMG="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          test -f "$DMG"
          MOUNT_POINT="$RUNNER_TEMP/dots-dmg"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_POINT"
          trap 'hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true' EXIT
          APP="$(find "$MOUNT_POINT" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -F 'Identifier=com.sl.dots'
          test -z "$(find "$APP" -type d -name '*.dSYM' -print -quit)"

          EXECUTABLE="$(defaults read "$APP/Contents/Info" CFBundleExecutable)"
          BINARY="$APP/Contents/MacOS/$EXECUTABLE"
          test -x "$BINARY"
          ARCHS="$(lipo -archs "$BINARY")"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64
          if otool -l "$BINARY" | grep -Eq 'sectname __debug|segname __DWARF'; then
            echo "Debug sections found in macOS executable" >&2
            exit 1
          fi
          if nm -gj "$BINARY" 2>/dev/null | grep -Eiq 'choose_ai_move|minimax|closure_pressure|setup_potential|find_new_captures|find_house_capture'; then
            echo "Sensitive game-core symbol exported by macOS executable" >&2
            exit 1
          fi

          hdiutil detach "$MOUNT_POINT"
          trap - EXIT
          mkdir -p release
          cp "$DMG" "release/Dots-v${VERSION}-macOS-universal.dmg"

      - name: Attach DMG to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..30}; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" "release/Dots-v${VERSION}-macOS-universal.dmg" --clobber
