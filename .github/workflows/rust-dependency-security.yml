name: Rust dependency security

on:
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - scripts/verify-cargo-dependency-policy.sh
      - scripts/audit-rust-dependencies.sh
      - scripts/verify-rust-advisory-scope.sh
      - scripts/install-cargo-audit.mjs
      - .github/workflows/rust-dependency-security.yml
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - scripts/verify-cargo-dependency-policy.sh
      - scripts/audit-rust-dependencies.sh
      - scripts/verify-rust-advisory-scope.sh
      - scripts/install-cargo-audit.mjs
      - .github/workflows/rust-dependency-security.yml
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Cargo dependency policy
        run: bash scripts/verify-cargo-dependency-policy.sh
      - name: Install verified RustSec audit tool
        run: node scripts/install-cargo-audit.mjs
      - name: Audit Rust dependencies
        run: bash scripts/audit-rust-dependencies.sh
