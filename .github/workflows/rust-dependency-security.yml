name: Rust dependency security

on:
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - .github/workflows/rust-dependency-security.yml
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - .github/workflows/rust-dependency-security.yml
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        run: |
          cargo audit --deny warnings --file crates/game-core/Cargo.lock
          cargo audit --deny unsound --deny yanked --ignore RUSTSEC-2024-0429 --file src-tauri/Cargo.lock
