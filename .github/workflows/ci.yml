name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Verify Rust dependency locks
        run: |
          cargo metadata --manifest-path crates/game-core/Cargo.toml --locked --no-deps >/dev/null
          cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps >/dev/null
      - name: Test and lint authoritative Rust core
        run: |
          cargo test --manifest-path crates/game-core/Cargo.toml --locked
          cargo clippy --manifest-path crates/game-core/Cargo.toml --all-targets --locked -- -D warnings
      - name: Configure Rust WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          sudo apt-get update
          sudo apt-get install -y binaryen
      - run: npm test
      - run: npm run build
