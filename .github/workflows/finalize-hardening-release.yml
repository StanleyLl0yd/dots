name: Finalize hardening release

on:
  push:
    branches:
      - hardening/rust-game-core-0.9.3
    paths:
      - .github/workflows/finalize-hardening-release.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Align 0.9.4 release metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          OLD = "0.9.3"
          NEW = "0.9.4"

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"unexpected {label} occurrence count: {count}")
              return text.replace(old, new, 1)

          package = Path("package.json")
          data = json.loads(package.read_text(encoding="utf-8"))
          if data.get("version") != OLD:
              raise SystemExit("unexpected package.json version")
          data["version"] = NEW
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          package_lock = Path("package-lock.json")
          text = package_lock.read_text(encoding="utf-8")
          needle = f'"version": "{OLD}"'
          if text.count(needle) < 2:
              raise SystemExit("package-lock root versions missing")
          text = text.replace(needle, f'"version": "{NEW}"', 2)
          package_lock.write_text(text, encoding="utf-8")

          tauri = Path("src-tauri/tauri.conf.json")
          data = json.loads(tauri.read_text(encoding="utf-8"))
          if data.get("version") != OLD:
              raise SystemExit("unexpected Tauri version")
          data["version"] = NEW
          tauri.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          for path in [Path("src-tauri/Cargo.toml"), Path("crates/game-core/Cargo.toml")]:
              text = path.read_text(encoding="utf-8")
              text = replace_once(text, f'version = "{OLD}"', f'version = "{NEW}"', str(path))
              path.write_text(text, encoding="utf-8")

          lock = Path("crates/game-core/Cargo.lock")
          text = lock.read_text(encoding="utf-8")
          text = replace_once(
              text,
              f'name = "game-core"\nversion = "{OLD}"',
              f'name = "game-core"\nversion = "{NEW}"',
              "game-core Cargo.lock package"
          )
          lock.write_text(text, encoding="utf-8")

          lock = Path("src-tauri/Cargo.lock")
          text = lock.read_text(encoding="utf-8")
          text = replace_once(
              text,
              f'name = "dots"\nversion = "{OLD}"',
              f'name = "dots"\nversion = "{NEW}"',
              "Tauri Cargo.lock dots package"
          )
          text = replace_once(
              text,
              f'name = "game-core"\nversion = "{OLD}"',
              f'name = "game-core"\nversion = "{NEW}"',
              "Tauri Cargo.lock game-core package"
          )
          lock.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          start = text.index("## [Unreleased]")
          next_release = text.index("## [0.9.3]", start)
          existing = text[start + len("## [Unreleased]"):next_release].strip()
          if not existing.startswith("### Changed"):
              raise SystemExit("unexpected Unreleased changelog layout")
          existing_changed = existing[len("### Changed"):].strip()
          release = f'''## [Unreleased]\n\n## [0.9.4] - 2026-09-02\n\n### Added\n\n- shared Rust `crates/game-core` as the single production implementation of move legality, capture/house topology, release/scoring, replay validation, and deterministic AI search for both native Tauri and web/PWA builds;\n- Rust topology/tactical/paired-strength regression coverage migrated from the removed TypeScript rules/AI implementation, plus frontend session/persistence tests that execute against the compiled WASM core;\n- permanent Rust CI, source-boundary enforcement, hardened web/native artifact verification, and dedicated Dependabot coverage for the shared Rust core.\n\n### Changed\n\n- web/PWA now executes the shared Rust core through optimized WASM while native Tauri links the same crate directly through four coarse IPC commands; the TypeScript layer is limited to DTO/session/persistence/Worker/UI orchestration;\n- removed the duplicate TypeScript rules, capture/scoring, AI search, AI-match harness, and their superseded reference tests after equivalent Rust regressions were established;\n- hardened Android release output with explicit non-debuggable JNI/app settings, minification/resource shrinking, native symbol/debug-section checks, and 16 KB ELF alignment validation, while macOS verification now checks universal architectures and stripped implementation symbols;\n- preserved gameplay rules, save format, AI policy/difficulty semantics, deterministic decisions, accessibility behavior, and PWA lifecycle while changing the implementation boundary;\n- source version advanced to 0.9.4 so hardened artifacts have a tag/source provenance distinct from the already published 0.9.3 release.\n\n{existing_changed}\n\n'''
          text = text[:start] + release + text[next_release:]
          changelog.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = replace_once(text, "source-0.9.3", "source-0.9.4", "README badge")
          text = replace_once(text, "Current source version: **0.9.3**", "Current source version: **0.9.4**", "README source version")
          old_status = "Version **0.9.3** is the RuStore-ready native distribution release. Android publication now uses a signed AAB with a dedicated upload key, reproducible store assets, and published privacy/terms pages. Gameplay, rules, save schemas, AI search policy, scoring, and web/PWA behavior remain unchanged."
          new_status = "Version **0.9.4** hardens the 0.9.3 native/RuStore baseline by moving authoritative rules, capture/scoring, replay validation, and deterministic AI into the shared Rust core used directly by Tauri and through WASM on the web. Gameplay rules, save schema, AI policy/difficulty semantics, accessibility, and PWA behavior are intentionally preserved."
          text = replace_once(text, old_status, new_status, "README current release paragraph")
          text = text.replace("0.9.3 Android AAB", "0.9.4 Android AAB")
          readme.write_text(text, encoding="utf-8")

          readme_ru = Path("README_RU.md")
          text = readme_ru.read_text(encoding="utf-8")
          text = replace_once(text, "source-0.9.3", "source-0.9.4", "README_RU badge")
          text = replace_once(text, "Текущая версия исходников: **0.9.3**", "Текущая версия исходников: **0.9.4**", "README_RU source version")
          old_status = "Версия **0.9.3** — готовый для RuStore нативный релиз. Android теперь публикуется как подписанный AAB с отдельным upload key, воспроизводимыми материалами магазина и опубликованными страницами политики конфиденциальности/пользовательского соглашения. Игровые правила, формат сохранения, политика ИИ, счёт и поведение web/PWA не изменены."
          new_status = "Версия **0.9.4** усиливает нативную/RuStore-базу 0.9.3: авторитетные правила, захваты/счёт, replay-проверка и детерминированный ИИ перенесены в общее Rust-ядро, которое Tauri использует напрямую, а web/PWA — через WASM. Игровые правила, формат сохранения, политика/уровни ИИ, доступность и PWA lifecycle намеренно сохранены."
          if old_status in text:
              text = text.replace(old_status, new_status, 1)
          else:
              text = text.replace("Версия **0.9.3**", "Версия **0.9.4**", 1)
          text = text.replace("0.9.3 Android AAB", "0.9.4 Android AAB")
          readme_ru.write_text(text, encoding="utf-8")

          ai_doc = Path("docs/AI.md")
          text = ai_doc.read_text(encoding="utf-8")
          text = text.replace("`placeStone()`", "`place_stone()`")
          text = text.replace("Version **0.9.3** retains", "Version **0.9.4** retains")
          ai_doc.write_text(text, encoding="utf-8")

          arch = Path("docs/ARCHITECTURE.md")
          text = arch.read_text(encoding="utf-8")
          text = text.replace("`placeStone()`", "`place_stone()`")
          text = text.replace("`immediateCaptureThreat()`", "`immediate_capture_threat()`")
          text = text.replace("`setupPotential()`", "`setup_potential()`")
          text = text.replace("`pairedMatchMargin()`", "`paired_match_margin()`")
          text = text.replace(
              "The CI suite deliberately uses short deterministic matches rather than a wall-clock benchmark. Expert must not lose the paired Expert-vs-Normal or Expert-vs-Hard comparisons and must maintain a positive captured-score margin across them. `ai-tactical-benchmark.test.ts` complements those matches with six fixed decisions covering immediate multi-capture, mandatory defense, false closure, hostile-house safety, counter-capture under double threat, and capture-of-capture release. These are regression guards, not Elo claims.",
              "The CI suite deliberately uses short deterministic matches rather than a wall-clock benchmark. Expert must not lose the paired Expert-vs-Normal or Expert-vs-Hard comparisons and must maintain a positive captured-score margin across them. Six fixed cases in the same Rust regression module cover immediate multi-capture, mandatory defense, false closure, hostile-house safety, counter-capture under double threat, and capture-of-capture release. These are regression guards, not Elo claims."
          )
          text = text.replace(
              "The selected difficulty is passed to `chooseAiMove()` for each newly scheduled computer turn.",
              "The selected difficulty is passed through the native/WASM core request for each newly scheduled computer turn."
          )
          text = text.replace(
              "`src-tauri/` is a thin Tauri 2 shell around the same compiled TypeScript/Canvas frontend. It does not reimplement game state, captures, scoring, persistence, or AI.",
              "`src-tauri/` is a thin Tauri 2 shell that links the shared Rust game core and hosts the same TypeScript/Canvas frontend. It adds no second native rules, capture, scoring, persistence, or AI implementation."
          )
          text = text.replace(
              "Dependabot monitors npm, Cargo under `/src-tauri`, and GitHub Actions monthly.",
              "Dependabot monitors npm, Cargo under `/crates/game-core` and `/src-tauri`, and GitHub Actions monthly."
          )
          text = text.replace(
              "Version **0.9.3** is the current pre-1.0 native/RuStore baseline.",
              "Version **0.9.4** is the current pre-1.0 hardened native/RuStore baseline."
          )
          arch.write_text(text, encoding="utf-8")

          hardening = Path("docs/HARDENING.md")
          text = hardening.read_text(encoding="utf-8")
          text = text.replace(
              "`wasm-opt -Oz --strip-debug --strip-producers`",
              "`wasm-opt -Oz --enable-bulk-memory --enable-sign-ext --strip-debug --strip-producers`"
          )
          hardening.write_text(text, encoding="utf-8")
          PY

      - name: Verify aligned lock metadata
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='0.9.4'||l.version!==p.version||l.packages[''].version!==p.version) process.exit(1)"
          grep -F 'version = "0.9.4"' crates/game-core/Cargo.toml
          grep -F 'version = "0.9.4"' src-tauri/Cargo.toml
          grep -F '"version": "0.9.4"' src-tauri/tauri.conf.json
          cargo metadata --manifest-path crates/game-core/Cargo.toml --locked --no-deps >/dev/null
          cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps >/dev/null

      - name: Commit finalized release state
        run: |
          git rm .github/workflows/finalize-hardening-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md README.md README_RU.md \
            crates/game-core/Cargo.toml crates/game-core/Cargo.lock \
            src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json \
            docs/AI.md docs/ARCHITECTURE.md docs/HARDENING.md
          git commit -m "release: prepare Dots 0.9.4 hardening"
          git push origin HEAD:hardening/rust-game-core-0.9.3
