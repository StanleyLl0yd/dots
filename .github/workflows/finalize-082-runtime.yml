name: Finalize 0.8.2 action runtimes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-082-runtime.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Synchronize hardening documentation and reset release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"missing expected text in {path}: {old[:80]}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          patch(
              "README.md",
              "- Node-24-compatible GitHub Actions runtime for checkout/setup plus Dependabot coverage for npm and GitHub Actions;",
              "- Node-24-compatible GitHub Actions runtimes for checkout/setup and Pages actions, plus Dependabot coverage for npm and GitHub Actions;",
          )
          patch(
              "README_RU.md",
              "- GitHub Actions `checkout/setup-node` на Node-24-compatible runtime и Dependabot для npm и GitHub Actions;",
              "- GitHub Actions `checkout/setup-node` и Pages-actions на Node-24-compatible runtime, плюс Dependabot для npm и GitHub Actions;",
          )
          patch(
              "docs/ARCHITECTURE.md",
              "GitHub workflows use maintained Node-24-compatible checkout/setup actions, and Dependabot monitors both npm dependencies and GitHub Actions monthly.",
              "GitHub workflows use maintained Node-24-compatible checkout/setup and Pages actions, and Dependabot monitors both npm dependencies and GitHub Actions monthly.",
          )
          patch(
              "docs/PRODUCT.md",
              "- maintained Node-24-compatible checkout/setup GitHub Actions;",
              "- maintained Node-24-compatible checkout/setup and Pages GitHub Actions;",
          )
          patch(
              "CHANGELOG.md",
              "- upgraded `actions/checkout` and `actions/setup-node` from v4 to v7 so workflow JavaScript actions no longer depend on the deprecated Node 20 action runtime.",
              "- upgraded GitHub Actions to maintained Node-24 generations: `actions/checkout`/`actions/setup-node` v4→v7, `actions/configure-pages` v5→v6, `actions/upload-pages-artifact` v3→v5, and `actions/deploy-pages` v4→v5, eliminating the Node 20 runtime deprecation warnings from CI and Pages.",
          )
          PY

          gh release delete v0.8.2 --yes --cleanup-tag
          rm .github/workflows/finalize-082-runtime.yml

      - name: Commit final hardening state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_RU.md CHANGELOG.md docs/ARCHITECTURE.md docs/PRODUCT.md .github/workflows/finalize-082-runtime.yml
          git commit -m "chore: finalize 0.8.2 Node 24 action hardening"
          git push
