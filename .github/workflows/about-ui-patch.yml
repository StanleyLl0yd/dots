name: About UI patch

on:
  push:
    branches: [ui/about-dialog]
    paths:
      - .github/workflows/about-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/about-dialog
      - name: Apply About UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          about_ts = '''import { version } from "../package.json";
          import "./about.css";
          import { resolveLocale } from "./i18n";

          const messages = {
            ru: {
              label: "О приложении",
              title: "О приложении",
              intro: "«Точки» — минималистичная цифровая версия классической игры. Окружайте точки соперника, захватывайте область и играйте вдвоём или против компьютера.",
              version: "Версия",
              github: "Проект на GitHub",
              rights: "© 2026 Stanley Lloyd. Все права защищены.",
              close: "Закрыть"
            },
            en: {
              label: "About",
              title: "About",
              intro: "Dots is a minimalist digital version of the classic game. Surround opponent dots, capture territory, and play locally or against the computer.",
              version: "Version",
              github: "Project on GitHub",
              rights: "© 2026 Stanley Lloyd. All rights reserved.",
              close: "Close"
            }
          } as const;

          const copy = messages[resolveLocale()];
          const app = document.querySelector<HTMLDivElement>("#app");
          const brand = document.querySelector<HTMLElement>(".brand");
          if (!app || !brand) throw new Error("About UI initialization failed");

          const button = document.createElement("button");
          button.className = "about-button";
          button.type = "button";
          button.setAttribute("aria-label", copy.label);
          button.title = copy.label;
          button.innerHTML = '<span aria-hidden="true">i</span>';

          const dialog = document.createElement("dialog");
          dialog.className = "game-dialog about-dialog";
          dialog.setAttribute("aria-labelledby", "about-title");
          dialog.innerHTML = `
            <form method="dialog">
              <h2 id="about-title">${copy.title}</h2>
              <p>${copy.intro}</p>
              <p class="about-meta">${copy.version} ${version}</p>
              <a class="about-link" href="https://github.com/StanleyLl0yd/dots" target="_blank" rel="noreferrer">${copy.github}</a>
              <p class="about-rights">${copy.rights}</p>
              <div class="dialog-actions"><button value="close" autofocus>${copy.close}</button></div>
            </form>
          `;

          brand.append(button);
          app.append(dialog);
          button.addEventListener("click", () => {
            if (!dialog.open) dialog.showModal();
          });
          '''

          about_css = '''.brand {
            position: relative;
            padding-right: 42px;
          }

          .about-button {
            position: absolute;
            top: -2px;
            right: 0;
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            padding: 0;
            border: 1px solid #b9ae9e;
            border-radius: 999px;
            background: #fffaf2;
            color: #71695f;
            font-size: 15px;
            font-weight: 800;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 2px 10px rgb(43 41 37 / .08);
          }

          .about-button:hover {
            border-color: #8e8374;
            color: #2b2925;
          }

          .about-dialog .about-meta,
          .about-dialog .about-rights {
            font-size: 13px;
          }

          .about-link {
            width: fit-content;
            color: #1d4ed8;
            font-weight: 600;
            text-underline-offset: 3px;
          }

          .about-link:focus-visible {
            outline: 3px solid #2563eb;
            outline-offset: 2px;
            border-radius: 4px;
          }

          @media (forced-colors: active) {
            .about-button { border-color: CanvasText; }
            .about-link:focus-visible { outline-color: Highlight; }
          }

          @media (prefers-color-scheme: dark) {
            .about-button {
              background: rgb(42 39 34 / .96);
              color: #b5aca0;
              border-color: #514b42;
            }
            .about-button:hover { color: #eee8de; border-color: #746b5f; }
            .about-link { color: #60a5fa; }
          }
          '''

          Path("src/about.ts").write_text(about_ts, encoding="utf-8")
          Path("src/about.css").write_text(about_css, encoding="utf-8")

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          needle = '    <script type="module" src="/src/main.ts"></script>\n'
          addition = '    <script type="module" src="/src/about.ts"></script>\n'
          if addition not in text:
              if needle not in text:
                  raise SystemExit("index.html insertion point not found")
              text = text.replace(needle, needle + addition, 1)
              index.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "## [Unreleased]\n\n### Changed\n"
          replacement = "## [Unreleased]\n\n### Added\n\n- compact localized About dialog with current package version, copyright notice, and project link.\n\n### Changed\n"
          if "compact localized About dialog" not in text:
              if marker not in text:
                  raise SystemExit("CHANGELOG insertion point not found")
              text = text.replace(marker, replacement, 1)
              changelog.write_text(text, encoding="utf-8")

          product = Path("docs/PRODUCT.md")
          text = product.read_text(encoding="utf-8")
          marker = "Latest-move rings, move counters, desktop snap previews, invalid-placement markers, capture emphasis, first-run Help, and the mobile action toolbar are presentation only. **Fit game** derives a bounded viewport from placed-stone coordinates and cannot alter rule-space coordinates or history. Capture feedback is derived from confirmed before/after active capture state; reduced-motion mode may suppress transient emphasis but not essential textual/assistive feedback.\n"
          addition = "\nA compact localized **About** control sits beside the product title and opens version, copyright, and project-link information without touching game/session state.\n"
          if "localized **About** control" not in text:
              if marker not in text:
                  raise SystemExit("PRODUCT insertion point not found")
              text = text.replace(marker, marker + addition, 1)
              product.write_text(text, encoding="utf-8")
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/about.ts src/about.css index.html CHANGELOG.md docs/PRODUCT.md
          git commit -m "feat: add About dialog"
          git push
