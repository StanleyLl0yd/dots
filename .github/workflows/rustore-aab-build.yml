name: RuStore AAB Build

on:
  push:
    branches:
      - release/dots-0.9.3-rustore-aab
    paths:
      - package.json
      - package-lock.json
      - src/**
      - src-tauri/**
      - scripts/tauri-android-build.gradle.kts
      - .github/workflows/rustore-aab-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aab:
    name: Signed RuStore AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install and verify dependencies
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm install --no-save --package-lock=false @tauri-apps/cli@2.11.4
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts.tauri = 'tauri';
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Configure Android toolchain
        run: |
          NDK_PATH="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -d "$NDK_PATH"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Initialize Android wrapper
        run: |
          npx tauri android init --ci
          npx tauri icon public/pwa-192.png
          cp scripts/tauri-android-build.gradle.kts src-tauri/gen/android/app/build.gradle.kts

      - name: Build signed AAB
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" && -n "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" && -n "$ANDROID_UPLOAD_KEY_ALIAS" && -n "$ANDROID_UPLOAD_KEY_PASSWORD" ]]; then
            KEYSTORE_BASE64="$ANDROID_UPLOAD_KEYSTORE_BASE64"
            STORE_PASSWORD="$ANDROID_UPLOAD_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_UPLOAD_KEY_ALIAS"
            KEY_PASSWORD="$ANDROID_UPLOAD_KEY_PASSWORD"
            SIGNING_MODE="dedicated-upload-key"
          else
            test -n "$ANDROID_KEYSTORE_BASE64"
            test -n "$ANDROID_KEYSTORE_PASSWORD"
            test -n "$ANDROID_KEY_ALIAS"
            test -n "$ANDROID_KEY_PASSWORD"
            KEYSTORE_BASE64="$ANDROID_KEYSTORE_BASE64"
            STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
            SIGNING_MODE="existing-app-signing-key-as-upload-key"
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/dots-rustore-upload.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          export STORE_PASSWORD KEY_PASSWORD KEY_ALIAS KEYSTORE_PATH
          python3 - <<'PY'
          import os
          from pathlib import Path

          def prop(value: str) -> str:
              return value.replace('\\', '\\\\').replace('\r', '\\r').replace('\n', '\\n').replace('=', '\\=').replace(':', '\\:')

          Path('src-tauri/gen/android/keystore.properties').write_text('\n'.join([
              f"storePassword={prop(os.environ['STORE_PASSWORD'])}",
              f"keyPassword={prop(os.environ['KEY_PASSWORD'])}",
              f"keyAlias={prop(os.environ['KEY_ALIAS'])}",
              f"storeFile={prop(os.environ['KEYSTORE_PATH'])}",
              '',
          ]), encoding='utf-8')
          PY

          npx tauri android build --aab

          mkdir -p release
          AAB="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print -quit)"
          test -f "$AAB"
          cp "$AAB" "release/Dots-v${VERSION}-Android.aab"
          keytool -exportcert -alias "$KEY_ALIAS" -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -rfc -file release/uploadcert.pem >/dev/null
          printf '%s\n' "$SIGNING_MODE" > release/signing-mode.txt

          rm -f src-tauri/gen/android/keystore.properties "$KEYSTORE_PATH"

      - name: Verify AAB
        run: |
          AAB="release/Dots-v${VERSION}-Android.aab"
          JARSIGNER_LOG="$RUNNER_TEMP/jarsigner.txt"
          jarsigner -verify -verbose -certs "$AAB" > "$JARSIGNER_LOG" 2>&1
          grep -q "jar verified" "$JARSIGNER_LOG"
          BUNDLETOOL="$RUNNER_TEMP/bundletool.jar"
          curl -fsSL "https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar" -o "$BUNDLETOOL"
          PACKAGE="$(java -jar "$BUNDLETOOL" dump manifest --bundle="$AAB" --module=base --xpath='/manifest/@package' | tr -d '"\r\n')"
          test "$PACKAGE" = "com.sl.dots"
          test "$(stat -c%s "$AAB")" -lt 5368709120
          keytool -printcert -file release/uploadcert.pem >/dev/null

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Dots-v${{ env.VERSION }}-RuStore-AAB
          path: |
            release/Dots-v${{ env.VERSION }}-Android.aab
            release/uploadcert.pem
            release/signing-mode.txt
          if-no-files-found: error
