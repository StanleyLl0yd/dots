name: RuStore Assets

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - rust-toolchain.toml
      - index.html
      - tsconfig.json
      - vite.config.ts
      - src/**
      - public/**
      - crates/game-core/**
      - src-tauri/**
      - branding/**
      - scripts/prepare-icon-assets.mjs
      - scripts/build-game-core-wasm.mjs
      - scripts/wasm-toolchain.mjs
      - scripts/verify-source-boundary.mjs
      - scripts/capture-rustore-android.mjs
      - scripts/run-rustore-emulator-capture.sh
      - scripts/tauri-android-build.gradle.kts
      - store/rustore/**
      - .github/workflows/rustore-assets.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: rustore-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download pinned Android JDK
        shell: bash
        run: |
          JDK_ARCHIVE="$RUNNER_TEMP/OpenJDK17U-jdk_x64_linux_hotspot_17.0.20.1_1.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$JDK_ARCHIVE" \
            "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jdk_x64_linux_hotspot_17.0.20.1_1.tar.gz"
          printf '%s  %s\n' \
            '3808d1d15e3ec6bd5b84057fb5d84c33d8a1536a258146bcea2e603fc726e08e' \
            "$JDK_ARCHIVE" | sha256sum --check --status
          echo "ANDROID_JDK_ARCHIVE=$JDK_ARCHIVE" >> "$GITHUB_ENV"

      - name: Set up Android JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: jdkfile
          jdk-file: ${{ env.ANDROID_JDK_ARCHIVE }}
          java-version: "17.0.20.1"
          architecture: x64

      - name: Verify Android JDK
        run: |
          java -version 2>&1 | tee "$RUNNER_TEMP/java-version.txt"
          grep -F '17.0.20.1' "$RUNNER_TEMP/java-version.txt"

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo dependency policy
        run: bash scripts/verify-cargo-dependency-policy.sh

      - name: Install and verify dependencies
        run: |
          npm run verify:dependencies
          npm run verify:version
          npm ci
          npm audit --audit-level=high
          npm test
          python3 -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Configure Android toolchain
        run: |
          cargo metadata --format-version 1 --manifest-path src-tauri/Cargo.toml --locked --no-deps >/dev/null
          NDK_VERSION="29.0.14206865"
          BUILD_TOOLS_VERSION="36.0.0"
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"
          BUILD_TOOLS_PATH="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          PACKAGES=("platforms;android-36" "build-tools;$BUILD_TOOLS_VERSION" "ndk;$NDK_VERSION")
          yes | "$SDKMANAGER" "${PACKAGES[@]}" >/dev/null

          test -d "$NDK_PATH"
          test -d "$BUILD_TOOLS_PATH"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          rustup target add x86_64-linux-android

      - name: Build emulator APK
        run: |
          npm run prepare:icons
          npm run tauri android init -- --ci
          MAIN_ACTIVITY="$(find src-tauri/gen/android/app/src/main/java -type f -name MainActivity.kt -print -quit)"
          test -f "$MAIN_ACTIVITY"
          python3 - "$MAIN_ACTIVITY" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()
          if "import android.webkit.WebView" not in text:
              text = text.replace(
                  "import android.os.Bundle\n",
                  "import android.os.Bundle\nimport android.view.WindowInsets\nimport android.view.WindowInsetsController\nimport android.webkit.WebView\n",
                  1,
              )
          needle = "  override fun onCreate(savedInstanceState: Bundle?) {\n"
          if needle not in text:
              print(text)
              raise SystemExit("Unexpected generated MainActivity.kt")
          if "WebView.setWebContentsDebuggingEnabled(true)" not in text:
              text = text.replace(
                  needle,
                  needle + "    WebView.setWebContentsDebuggingEnabled(true)\n",
                  1,
              )
          super_call = "    super.onCreate(savedInstanceState)\n"
          if super_call not in text:
              print(text)
              raise SystemExit("Generated MainActivity has no super.onCreate call")
          if "WindowInsets.Type.systemBars()" not in text:
              text = text.replace(
                  super_call,
                  super_call + "    window.insetsController?.apply {\n      hide(WindowInsets.Type.systemBars())\n      systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE\n    }\n",
                  1,
              )
          path.write_text(text)
          print(text)
          PY
          cp scripts/tauri-android-build.gradle.kts src-tauri/gen/android/app/build.gradle.kts
          npm run tauri android build -- --apk --debug --target x86_64
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -f "$APK"
          echo "EMULATOR_APK=$APK" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Capture Android emulator screenshots
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/run-rustore-emulator-capture.sh "$EMULATOR_APK"

      - name: Generate store icon and promo banner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          out = Path('store/rustore/generated')
          out.mkdir(parents=True, exist_ok=True)
          source_icon = Path('public/icon-512.png')
          target_icon = out / 'icon-512.png'
          target_icon.write_bytes(source_icon.read_bytes())

          width, height = 1080, 607
          banner = Image.new('RGB', (width, height), '#f4efe5')
          draw = ImageDraw.Draw(banner)
          banner_grid = '#d7d0c4'
          for x in range(0, width, 54):
              draw.line((x, 0, x, height), fill=banner_grid, width=1)
          for y in range(0, height, 54):
              draw.line((0, y, width, y), fill=banner_grid, width=1)

          banner_red = '#d94444'
          banner_blue = '#367bd6'
          for x, y in [(135, 142), (216, 223), (135, 304), (54, 223)]:
              draw.ellipse((x-16, y-16, x+16, y+16), fill=banner_red)
          draw.ellipse((119, 207, 151, 239), fill=banner_blue)
          for x, y in [(350, 170), (431, 251), (350, 332), (269, 251)]:
              draw.ellipse((x-16, y-16, x+16, y+16), fill=banner_blue)
          draw.ellipse((334, 235, 366, 267), fill=banner_red)

          font_root = Path('/usr/share/fonts/truetype/dejavu')
          title = ImageFont.truetype(str(font_root / 'DejaVuSans-Bold.ttf'), 92)
          subtitle = ImageFont.truetype(str(font_root / 'DejaVuSans.ttf'), 30)
          small = ImageFont.truetype(str(font_root / 'DejaVuSans.ttf'), 24)
          draw.text((535, 145), 'DOTS', font=title, fill='#2b2925')
          draw.text((539, 270), 'Классическая игра «Точки»', font=subtitle, fill='#2b2925')
          draw.text((541, 322), 'Офлайн · вдвоём · против компьютера', font=small, fill='#625e57')
          banner.save(out / 'promo-banner-1080x607.png', optimize=True)
          PY

      - name: Verify RuStore assets and ASO copy
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image

          expected = {
              'icon-512.png': (512, 512),
              'promo-banner-1080x607.png': (1080, 607),
              '01-game-capture.png': (1080, 1920),
              '02-vs-computer.png': (1080, 1920),
              '03-help.png': (1080, 1920),
              '04-about.png': (1080, 1920),
          }
          screenshot_names = {
              '01-game-capture.png',
              '02-vs-computer.png',
              '03-help.png',
              '04-about.png',
          }
          root = Path('store/rustore/generated')
          for name, size in expected.items():
              path = root / name
              with Image.open(path) as source:
                  image = source.copy()
              if name in screenshot_names and image.size == (size[0] + 2, size[1] + 2):
                  image = image.crop((1, 1, image.width - 1, image.height - 1))
                  image.save(path, optimize=True)
              if image.size != size:
                  raise SystemExit(f'{name}: expected {size}, got {image.size}')

          copy = Path('store/rustore/console-copy')
          name = (copy / '01-name.txt').read_text().strip()
          subtitle = (copy / '02-subtitle.txt').read_text().strip()
          short = (copy / '03-short-description.txt').read_text().strip()
          full = (copy / '04-full-description.txt').read_text().strip()
          version = os.environ['VERSION']
          whats_new = (copy / f'05-whats-new-{version}.txt').read_text().strip()
          if not name or len(name) > 30:
              raise SystemExit(f'RuStore name length invalid: {len(name)}')
          if not subtitle or len(subtitle) > 80:
              raise SystemExit(f'RuStore subtitle length invalid: {len(subtitle)}')
          if not short or len(short) > 80:
              raise SystemExit(f'RuStore short description length invalid: {len(short)}')
          if not 2000 <= len(full) <= 4000:
              raise SystemExit(f'RuStore full description length invalid: {len(full)}')
          if not whats_new:
              raise SystemExit('RuStore What’s New is empty')
          PY
          test -s store/rustore/metadata-ru.md
          mkdir -p release/package/console-copy
          cp store/rustore/generated/*.png release/package/
          cp store/rustore/metadata-ru.md release/package/
          cp store/rustore/README.md release/package/
          cp store/rustore/UPLOAD.md release/package/
          cp store/rustore/SIGNING.md release/package/
          cp store/rustore/console-copy/*.txt release/package/console-copy/
          (cd release/package && zip -9 -r "$GITHUB_WORKSPACE/release/Dots-v${VERSION}-RuStore-assets.zip" .)

      - name: Upload RuStore assets artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Dots-v${{ env.VERSION }}-RuStore-assets
          path: release/Dots-v${{ env.VERSION }}-RuStore-assets.zip
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download RuStore assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Dots-v${{ needs.assets.outputs.version }}-RuStore-assets
          path: release

      - name: Attach assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.assets.outputs.version }}
        run: |
          TAG="v${VERSION}"
          for attempt in {1..30}; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          gh release view "$TAG" >/dev/null

          EXPECTED="$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}')"
          if [[ -z "$EXPECTED" ]]; then
            EXPECTED="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          fi
          test -n "$EXPECTED"
          if [[ "$EXPECTED" != "$GITHUB_SHA" ]]; then
            echo "Skipping release attachment: $TAG points to $EXPECTED, current push is $GITHUB_SHA"
            exit 0
          fi

          gh release upload "$TAG" "release/Dots-v${VERSION}-RuStore-assets.zip" --clobber
