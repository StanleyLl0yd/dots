name: Sync RuStore Docs

on:
  push:
    branches:
      - release/dots-0.9.3-rustore-aab
    paths:
      - scripts/sync-rustore-docs.py
      - .github/workflows/sync-rustore-docs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/dots-0.9.3-rustore-aab

      - name: Synchronize documentation
        run: python3 scripts/sync-rustore-docs.py

      - name: Commit synchronized documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_RU.md CHANGELOG.md
          git rm scripts/sync-rustore-docs.py .github/workflows/sync-rustore-docs.yml
          git commit -m "release: synchronize 0.9.3 documentation"
          git push origin HEAD:release/dots-0.9.3-rustore-aab
