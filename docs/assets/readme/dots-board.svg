<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Dots game board</title>
  <desc id="desc">Notebook grid with a valid red capture boundary made only from neighboring dots surrounding blue dots</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#bfd4ea" stroke-width="1.1"/>
    </pattern>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#dc2626" stroke-opacity=".15" stroke-width="4"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="26" fill="#f7f4ee"/>
  <rect x="20" y="20" width="1160" height="380" rx="18" fill="url(#grid)"/>

  <path d="M600 80 560 120 520 160 520 200 520 240 560 240 600 280 640 240 680 240 720 200 680 160 640 120Z"
        fill="url(#hatch)" stroke="#dc2626" stroke-width="7" stroke-linejoin="round"/>

  <g fill="#dc2626">
    <circle cx="600" cy="80" r="10"/>
    <circle cx="560" cy="120" r="10"/>
    <circle cx="520" cy="160" r="10"/>
    <circle cx="520" cy="200" r="10"/>
    <circle cx="520" cy="240" r="10"/>
    <circle cx="560" cy="240" r="10"/>
    <circle cx="600" cy="280" r="10"/>
    <circle cx="640" cy="240" r="10"/>
    <circle cx="680" cy="240" r="10"/>
    <circle cx="720" cy="200" r="10"/>
    <circle cx="680" cy="160" r="10"/>
    <circle cx="640" cy="120" r="10"/>
  </g>

  <g fill="#2563eb">
    <circle cx="600" cy="140" r="11"/>
    <circle cx="560" cy="180" r="11"/>
    <circle cx="600" cy="180" r="11"/>
    <circle cx="640" cy="180" r="11"/>
    <circle cx="560" cy="220" r="11"/>
    <circle cx="600" cy="220" r="11"/>
    <circle cx="640" cy="220" r="11"/>
    <circle cx="600" cy="260" r="11"/>
  </g>

  <g fill="#2563eb">
    <circle cx="180" cy="80" r="10"/>
    <circle cx="260" cy="160" r="10"/>
    <circle cx="100" cy="200" r="10"/>
    <circle cx="340" cy="280" r="10"/>
    <circle cx="260" cy="360" r="10"/>
    <circle cx="520" cy="80" r="10"/>
    <circle cx="840" cy="80" r="10"/>
    <circle cx="840" cy="160" r="10"/>
    <circle cx="760" cy="220" r="10"/>
    <circle cx="1000" cy="280" r="10"/>
    <circle cx="1080" cy="120" r="10"/>
    <circle cx="1080" cy="280" r="10"/>
    <circle cx="920" cy="360" r="10"/>
  </g>

  <g fill="#ef4444">
    <circle cx="340" cy="80" r="10"/>
    <circle cx="700" cy="80" r="10"/>
    <circle cx="1000" cy="80" r="10"/>
    <circle cx="100" cy="160" r="10"/>
    <circle cx="340" cy="200" r="10"/>
    <circle cx="1000" cy="160" r="10"/>
    <circle cx="180" cy="200" r="10"/>
    <circle cx="860" cy="280" r="10"/>
    <circle cx="180" cy="320" r="10"/>
    <circle cx="840" cy="320" r="10"/>
    <circle cx="100" cy="360" r="10"/>
    <circle cx="520" cy="360" r="10"/>
  </g>

  <text x="70" y="90" font-family="ui-sans-serif,system-ui,sans-serif" font-size="44" font-weight="700" fill="#2b2925">DOTS</text>
  <text x="72" y="126" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" letter-spacing="4" fill="#71695f">CLOSE THE LOOP</text>
</svg>
