<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Dots game board</title>
  <desc id="desc">Notebook grid with red dots surrounding blue dots</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c9bfae" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#dc2626" stroke-opacity=".17" stroke-width="4"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="26" fill="#f4efe5"/>
  <rect x="20" y="20" width="1160" height="380" rx="18" fill="url(#grid)"/>
  <path d="M360 120 440 80 560 80 680 120 760 200 720 280 600 320 480 320 360 280 320 200Z" fill="url(#hatch)" stroke="#dc2626" stroke-width="7" stroke-linejoin="round"/>
  <g fill="#dc2626">
    <circle cx="360" cy="120" r="10"/><circle cx="440" cy="80" r="10"/><circle cx="560" cy="80" r="10"/><circle cx="680" cy="120" r="10"/><circle cx="760" cy="200" r="10"/><circle cx="720" cy="280" r="10"/><circle cx="600" cy="320" r="10"/><circle cx="480" cy="320" r="10"/><circle cx="360" cy="280" r="10"/><circle cx="320" cy="200" r="10"/>
  </g>
  <g fill="#2563eb">
    <circle cx="440" cy="160" r="11"/><circle cx="520" cy="200" r="11"/><circle cx="600" cy="160" r="11"/><circle cx="640" cy="240" r="11"/><circle cx="480" cy="240" r="11"/>
  </g>
  <g fill="#2563eb"><circle cx="880" cy="120" r="11"/><circle cx="920" cy="200" r="11"/><circle cx="840" cy="240" r="11"/></g>
  <g fill="#dc2626"><circle cx="1000" cy="160" r="10"/><circle cx="1040" cy="240" r="10"/></g>
  <text x="70" y="90" font-family="ui-sans-serif,system-ui,sans-serif" font-size="44" font-weight="700" fill="#2b2925">DOTS</text>
  <text x="72" y="126" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" letter-spacing="4" fill="#71695f">CLOSE THE LOOP</text>
</svg>
